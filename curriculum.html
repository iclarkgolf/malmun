<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4단계 커리큘럼 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
    --accent-soft: rgba(224,153,58,0.06);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ padding:24px 0 8px; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }

  .header{ padding:8px 0 24px; }
  .header .tag{ font-size:12px; font-weight:600; color:var(--accent); margin:0 0 8px; }
  .header .title{ font-size:17px; font-weight:600; margin:0; line-height:1.4; }

  .path{ flex:1; }
  .stage{ display:flex; gap:14px; }
  .stage-marker{ display:flex; flex-direction:column; align-items:center; }
  .stage-num{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;
    background:rgba(255,255,255,0.08); color:var(--text-muted);
  }
  .stage.done .stage-num{ background:var(--accent); color:var(--accent-text); }
  .stage.active .stage-num{ background:rgba(224,153,58,0.2); border:1px solid var(--accent); color:#f0c98a; }
  .stage-line{ width:2px; flex:1; background:rgba(255,255,255,0.12); margin:4px 0; }
  .stage-card{
    flex:1; border-radius:12px; padding:14px; margin-bottom:16px; cursor:pointer;
    background:var(--card); border:none; text-align:left; width:100%; color:var(--text);
  }
  .stage.active .stage-card{ background:var(--accent-soft); border:0.5px solid rgba(224,153,58,0.3); }
  .stage-title{ font-size:14px; font-weight:600; margin:0 0 4px; }
  .stage.active .stage-title{ color:#f0c98a; }
  .stage-desc{ font-size:12px; color:var(--text-muted); margin:0; }
  .stage.active .stage-desc{ color:#c2a06a; }

  .bottom{ padding:16px 0 32px; }
  .btn-primary{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='mypage.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="header">
    <p class="tag">4단계 커리큘럼</p>
    <p class="title">초급부터 비즈니스 레벨까지</p>
  </div>

  <div class="path">
    <div class="stage done">
      <div class="stage-marker"><div class="stage-num">1</div><div class="stage-line"></div></div>
      <button class="stage-card" onclick="location.href='curriculum-stage.html?stage=1'">
        <p class="stage-title">초급 · 생존 회화</p>
        <p class="stage-desc">인사, 주문, 길찾기 등 기본 문형</p>
      </button>
    </div>
    <div class="stage active">
      <div class="stage-marker"><div class="stage-num">2</div><div class="stage-line"></div></div>
      <button class="stage-card" onclick="location.href='curriculum-stage.html?stage=2'">
        <p class="stage-title">중급 · 일상 심화</p>
        <p class="stage-desc">현재 내 위치 · 자유로운 대화, 감정 표현</p>
      </button>
    </div>
    <div class="stage">
      <div class="stage-marker"><div class="stage-num">3</div><div class="stage-line"></div></div>
      <button class="stage-card" onclick="location.href='curriculum-stage.html?stage=3'">
        <p class="stage-title">고급 · 비즈니스 회화</p>
        <p class="stage-desc">미팅, 이메일, 전화 응대</p>
      </button>
    </div>
    <div class="stage">
      <div class="stage-marker"><div class="stage-num">4</div></div>
      <button class="stage-card" onclick="location.href='curriculum-stage.html?stage=4'">
        <p class="stage-title">심화 · 시사·뉴스</p>
        <p class="stage-desc">뉴스 읽기, 시사 토론, 원어민 수준 뉘앙스</p>
      </button>
    </div>
  </div>

  <div class="bottom">
    <button class="btn-primary" onclick="location.href='curriculum-stage.html?stage=2'">내 진도 계속하기</button>
  </div>
</div>

</body>
</html>
