<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>튜터 지원하기 | 말문</title>
<meta name="description" content="말문에서 한국어 튜터로 활동해보세요. 지원 전 준비사항을 확인하고 간단한 지원서를 제출할 수 있어요.">

<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:520px; margin:0 auto; padding:0 20px 60px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:24px 0 8px; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }

  .header{ padding:16px 0 24px; }
  .header .tag{ font-size:12px; font-weight:600; color:var(--accent); margin:0 0 8px; }
  .header .title{ font-size:20px; font-weight:700; margin:0; line-height:1.4; }
  .header .sub{ font-size:13px; color:var(--text-secondary); margin:10px 0 0; line-height:1.6; }

  .guide-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:20px; margin-bottom:28px;
  }
  .guide-title{ font-size:14px; font-weight:700; margin:0 0 14px; }
  .guide-item{ display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; }
  .guide-item:last-child{ margin-bottom:0; }
  .guide-check{
    width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; margin-top:1px;
  }
  .guide-text{ font-size:13px; color:var(--text-secondary); line-height:1.6; }
  .guide-text b{ color:var(--text); }

  .perk-note{
    background:var(--accent-soft); border:1px solid #F0D9A8; border-radius:12px;
    padding:12px 14px; font-size:12px; color:var(--accent-text); line-height:1.6; margin-bottom:28px;
  }

  .photo-row{ display:flex; align-items:center; gap:12px; }
  .photo-preview{
    width:64px; height:64px; border-radius:50%; flex-shrink:0; background:#F3F1EA;
    background-size:cover; background-position:center; border:1px solid var(--card-border);
  }
  .photo-upload-btn{
    border:1px solid var(--card-border); background:#fff; color:var(--text-secondary);
    font-size:12px; font-weight:600; padding:9px 14px; border-radius:10px; cursor:pointer;
  }
  .photo-upload-btn:hover{ border-color:var(--accent); color:var(--accent-text); }
  .photo-status{ font-size:11px; color:var(--text-muted); margin-top:6px; }
  .required-mark{ color:#D85A30; }

  .form-section{ margin-bottom:20px; }
  label{ display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px; }
  .hint-small{ font-size:11px; color:var(--text-muted); margin:-4px 0 8px; }
  input[type=text], input[type=email], textarea, select{
    width:100%; padding:12px 14px; border:1px solid var(--card-border); border-radius:10px;
    font-size:14px; color:var(--text); font-family:inherit; background:#fff; box-sizing:border-box;
  }
  textarea{ resize:vertical; min-height:90px; line-height:1.6; }

  .chip-grid{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:9px 14px; border:1px solid var(--card-border); border-radius:20px; background:#fff;
    color:var(--text-secondary); font-size:13px; font-weight:600; cursor:pointer;
  }
  .chip.selected{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); }

  .submit-btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    font-size:15px; font-weight:700; cursor:pointer; border:none; margin-top:8px;
    background:var(--accent); color:var(--accent-text);
  }
  .submit-btn:disabled{ background:#EAE6D8; color:var(--text-muted); cursor:default; }
  .error-text{ font-size:12px; color:#D85A30; margin-top:8px; display:none; }

  .done-box{ text-align:center; padding:60px 20px; }
  .done-emoji{ font-size:48px; margin-bottom:16px; }
  .done-title{ font-size:17px; font-weight:700; margin:0 0 8px; }
  .done-sub{ font-size:13px; color:var(--text-secondary); line-height:1.7; }
  .done-status{
    display:inline-block; margin-top:16px; font-size:12px; font-weight:700; padding:6px 14px;
    border-radius:20px; background:var(--accent-soft); color:var(--accent-text);
  }

  .loading{ text-align:center; color:var(--text-muted); font-size:13px; padding:80px 0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='index.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div id="content"><p class="loading">불러오는 중...</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// 튜터 지원서 접수 시 PJ님께 이메일 알림을 보내는 Apps Script 웹앱 URL
// script.google.com에서 "말문 튜터지원알림" 스크립트 배포 후, 아래 자리에 배포된 URL을 붙여넣어 주세요.
const TUTOR_ALERT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyhNBKo6bRv_MTD-MhZ6Vit9XdCYqwSLydgkdzDSZlnbIzBBxWx4N6xKlawus-NMstsdQ/exec';

const DAY_OPTIONS = [
  { id:'mon', label:'월' }, { id:'tue', label:'화' }, { id:'wed', label:'수' },
  { id:'thu', label:'목' }, { id:'fri', label:'금' }, { id:'sat', label:'토' }, { id:'sun', label:'일' }
];
let selectedDays = [];
let photoURL = '';

function guideHtml(){
  return `
    <div class="header">
      <p class="tag">말문 튜터 지원</p>
      <p class="title">말문에서 한국어를 가르쳐보세요</p>
      <p class="sub">지원 전에 아래 사항을 먼저 확인해주세요. 확인되면 바로 아래에서 지원서를 작성할 수 있어요.</p>
    </div>

    <div class="guide-card">
      <p class="guide-title">지원 전 확인해주세요</p>
      <div class="guide-item">
        <div class="guide-check">✓</div>
        <div class="guide-text">얼굴이 잘 보이는 <b>본인 사진이 필수</b>예요 — 학생들이 신뢰하고 선택할 수 있도록요.</div>
      </div>
      <div class="guide-item">
        <div class="guide-check">✓</div>
        <div class="guide-text"><b>한국어 원어민이거나, 이에 준하는 유창한 실력</b>이 있어야 해요.</div>
      </div>
      <div class="guide-item">
        <div class="guide-check">✓</div>
        <div class="guide-text">단순히 언어만이 아니라 <b>한국 역사와 문화에도 젖어있어야</b> 해요 — 학생들이 궁금해하는 건 문법만이 아니거든요.</div>
      </div>
      <div class="guide-item">
        <div class="guide-check">✓</div>
        <div class="guide-text"><b>화상 수업이 가능한 환경</b> — 안정적인 인터넷과 카메라·마이크가 되는 기기가 있어야 해요.</div>
      </div>
      <div class="guide-item">
        <div class="guide-check">✓</div>
        <div class="guide-text"><b>주 1회 이상 시간</b>을 꾸준히 낼 수 있어야 해요. 정해진 스케줄 없이 자유롭게 요일·시간을 정할 수 있어요.</div>
      </div>
      <div class="guide-item">
        <div class="guide-check">✓</div>
        <div class="guide-text">교재나 자격증은 <b>필수가 아니에요</b> — 외국인과 대화하며 한국어를 가르치는 것에 관심이 있으면 충분해요.</div>
      </div>
    </div>

    <div class="perk-note">
      💡 한국어교원 자격증 소지자나 관련 강의·통역 경력이 있으시면 <b>우대</b>해요. 없어도 지원엔 전혀 문제없어요.
    </div>
  `;
}

function guideEntryHtml(){
  return `
    ${guideHtml()}
    <button type="button" class="submit-btn" id="startApplyBtn">지원서 작성하기</button>
  `;
}

function formHtml(user, prefillName){
  return `
    <div class="header">
      <p class="tag">말문 튜터 지원</p>
      <p class="title">지원서를 작성해주세요</p>
      <p class="sub">아래 내용을 채워서 제출해주세요.</p>
    </div>
    <form id="applyForm">
      <div class="form-section">
        <label>본인 사진 <span class="required-mark">*필수</span></label>
        <div class="photo-row">
          <div class="photo-preview" id="photoPreview"></div>
          <div>
            <button type="button" class="photo-upload-btn" id="photoBtn">사진 선택</button>
            <input type="file" accept="image/*" id="photoFile" style="display:none;">
            <p class="photo-status" id="photoStatus"></p>
          </div>
        </div>
      </div>
      <div class="form-section">
        <label>이름</label>
        <input type="text" id="fName" value="${escapeAttr(prefillName)}" placeholder="말문에서 학생들에게 보여질 이름">
      </div>
      <div class="form-section">
        <label>연락 가능한 이메일</label>
        <input type="email" id="fEmail" value="${escapeAttr(user.email || '')}">
      </div>
      <div class="form-section">
        <label>카카오톡 ID (선택)</label>
        <input type="text" id="fKakao" placeholder="빠른 연락을 위해 남겨주시면 좋아요">
      </div>
      <div class="form-section">
        <label>한국어 원어민이신가요?</label>
        <select id="fNative">
          <option value="native">원어민이에요</option>
          <option value="fluent">원어민 수준으로 유창해요</option>
        </select>
      </div>
      <div class="form-section">
        <label>가르칠 수 있는 요일 (여러 개 선택 가능)</label>
        <div class="chip-grid" id="dayChips">
          ${DAY_OPTIONS.map(d => `<button type="button" class="chip" data-day="${d.id}">${d.label}</button>`).join('')}
        </div>
      </div>
      <div class="form-section">
        <label>자격증 · 경력 (있으시면 적어주세요, 우대돼요)</label>
        <p class="hint-small">예: 한국어교원 2급, 학원 강사 3년, 외국인 대상 과외 경험 등</p>
        <input type="text" id="fCredential" placeholder="없으면 비워두셔도 돼요">
      </div>
      <div class="form-section">
        <label>간단한 자기소개 / 지원 동기</label>
        <p class="hint-small">어떤 걸 가르치고 싶은지, 어떤 경험이 있는지 편하게 적어주세요</p>
        <textarea id="fIntro" placeholder="예: 회사원 3년차이고, 외국인 친구들과 대화하며 한국어를 알려준 경험이 있어요..."></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn" disabled>지원서 제출하기</button>
      <p class="error-text" id="errorText"></p>
    </form>
  `;
}

function doneHtml(status){
  const statusLabel = { pending: '검토 중', approved: '승인됨', rejected: '반려됨' }[status] || '검토 중';
  return `
    ${guideHtml()}
    <div class="done-box">
      <div class="done-emoji">🙌</div>
      <p class="done-title">이미 지원서를 보내주셨어요</p>
      <p class="done-sub">검토 후 남겨주신 이메일이나 카카오톡으로 연락드릴게요.<br>보통 며칠 안에 확인해서 알려드려요.</p>
      <span class="done-status">${statusLabel}</span>
    </div>
  `;
}

function escapeAttr(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML.replace(/"/g, '&quot;');
}

function wirePhotoUpload(user){
  const btn = document.getElementById('photoBtn');
  const fileInput = document.getElementById('photoFile');
  btn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if(!file) return;
    const statusEl = document.getElementById('photoStatus');
    statusEl.textContent = '업로드 중...';
    try{
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `tutorApplications/${user.uid}_${Date.now()}.${ext}`;
      const ref = storage.ref().child(path);
      await ref.put(file);
      photoURL = await ref.getDownloadURL();
      document.getElementById('photoPreview').style.background = `url('${photoURL}') center/cover`;
      statusEl.textContent = '업로드 완료';
      checkFormValid();
    }catch(err){
      console.error('사진 업로드 실패:', err);
      statusEl.textContent = '업로드 실패: ' + err.message;
    }
  });
}

function wireDayChips(){
  document.querySelectorAll('#dayChips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const day = chip.dataset.day;
      if(selectedDays.includes(day)){
        selectedDays = selectedDays.filter(d => d !== day);
        chip.classList.remove('selected');
      }else{
        selectedDays.push(day);
        chip.classList.add('selected');
      }
    });
  });
}

async function handleSubmit(e, user){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('errorText');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '제출 중...';

  try{
    const applicationData = {
      uid: user.uid,
      photoURL: photoURL,
      name: document.getElementById('fName').value.trim(),
      email: document.getElementById('fEmail').value.trim(),
      kakaoId: document.getElementById('fKakao').value.trim(),
      nativeLevel: document.getElementById('fNative').value,
      credential: document.getElementById('fCredential').value.trim(),
      availableDays: selectedDays,
      intro: document.getElementById('fIntro').value.trim()
    };
    await db.collection('tutorApplications').add({
      ...applicationData,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // PJ님께 즉시 이메일 알림 (실패해도 지원서 제출 자체는 정상 처리되도록 별도 try/catch)
    try{
      fetch(TUTOR_ALERT_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(applicationData)
      });
    }catch(alertErr){
      console.error('지원 알림 이메일 발송 실패(지원서 제출은 정상 완료됨):', alertErr);
    }

    if(window.gtag){ gtag('event', 'tutor_apply_submit'); }
    document.getElementById('content').innerHTML = doneHtml('pending');
  }catch(err){
    console.error('지원서 제출 실패:', err);
    errEl.textContent = '제출 중 문제가 생겼어요: ' + err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '지원서 제출하기';
  }
}

function checkFormValid(){
  const name = document.getElementById('fName').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const intro = document.getElementById('fIntro').value.trim();
  document.getElementById('submitBtn').disabled = !(name && email && intro && photoURL);
}

let currentUser = null;
let authResolved = false;
let applyIntentPending = false;

function wireStartButton(){
  const btn = document.getElementById('startApplyBtn');
  if(!btn) return;
  btn.addEventListener('click', () => {
    if(window.gtag){ gtag('event', 'tutor_apply_start_click'); }
    if(!authResolved){
      btn.disabled = true;
      btn.textContent = '확인 중...';
      applyIntentPending = true;
      return;
    }
    proceedAfterAuthCheck();
  });
}

function proceedAfterAuthCheck(){
  if(!currentUser){
    sessionStorage.setItem('malmunApplyIntent', '1');
    location.href = 'login.html?next=tutor-apply';
    return;
  }
  showApplicationFlow(currentUser);
}

async function showApplicationFlow(user){
  // 이미 지원한 적 있는지 확인
  try{
    const snap = await db.collection('tutorApplications').where('uid', '==', user.uid).limit(1).get();
    if(!snap.empty){
      const data = snap.docs[0].data();
      document.getElementById('content').innerHTML = doneHtml(data.status || 'pending');
      return;
    }
  }catch(err){
    console.error('지원 여부 확인 실패:', err);
  }

  let userDoc = {};
  try{
    const udoc = await db.collection('users').doc(user.uid).get();
    if(udoc.exists) userDoc = udoc.data();
  }catch(err){ /* 무시 — 프로필 정보 없어도 진행 가능 */ }

  const prefillName = userDoc.malmunDisplayName || user.displayName || '';
  document.getElementById('content').innerHTML = formHtml(user, prefillName);
  if(window.gtag){ gtag('event', 'tutor_apply_form_view'); }
  wireDayChips();
  wirePhotoUpload(user);
  ['fName','fEmail','fIntro'].forEach(id => {
    document.getElementById(id).addEventListener('input', checkFormValid);
  });
  document.getElementById('applyForm').addEventListener('submit', (e) => handleSubmit(e, user));
}

// 가이드 화면은 로그인 여부와 상관없이 바로 보여줌
document.getElementById('content').innerHTML = guideEntryHtml();
if(window.gtag){ gtag('event', 'tutor_apply_guide_view'); }
wireStartButton();

// 로그인 상태는 백그라운드에서 확인 (버튼 클릭 시 사용)
auth.onAuthStateChanged((user) => {
  currentUser = user;
  authResolved = true;

  if(applyIntentPending){
    applyIntentPending = false;
    proceedAfterAuthCheck();
    return;
  }

  // 로그인 화면 갔다가 돌아온 경우, 자동으로 지원서 작성 이어서 진행
  if(user && sessionStorage.getItem('malmunApplyIntent') === '1'){
    sessionStorage.removeItem('malmunApplyIntent');
    proceedAfterAuthCheck();
  }
});
</script>

</body>
</html>
