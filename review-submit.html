<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후기 남기기 | 말문</title>
<style>
  :root{
    --bg: #FFF9F0; --card: #FFFFFF; --card-border: #E8E4D8;
    --text: #2C2C2A; --text-secondary: #5F5E5A; --text-muted: #8A8880;
    --accent: #EF9F27; --accent-text: #412402; --accent-soft: #FFF3E0;
    --coral: #D85A30;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:40px 20px 60px; }
  .logo{ font-size:16px; font-weight:800; margin:0 0 32px; }
  .logo span{ color:var(--coral); }
  h1{ font-size:20px; margin:0 0 6px; }
  .sub{ font-size:14px; color:var(--text-secondary); line-height:1.6; margin:0 0 28px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; padding:12px 14px; border:1px solid var(--card-border); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--text);
  }
  .field textarea{ min-height:120px; resize:vertical; line-height:1.7; }

  .submit-btn{ width:100%; padding:14px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-text); font-weight:700; font-size:15px; cursor:pointer; margin-top:8px; }
  .submit-btn:disabled{ opacity:0.6; }

  #doneScreen{ display:none; text-align:center; padding:60px 0; }
  #doneScreen .icon{ font-size:40px; margin-bottom:16px; }
  #doneScreen h2{ font-size:18px; margin:0 0 8px; }
  #doneScreen p{ font-size:14px; color:var(--text-secondary); line-height:1.6; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; z-index:100; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.on{ opacity:1; }
</style>
</head>
<body>

<div class="wrap">
  <p class="logo"><span>i</span>말문</p>

  <div id="formScreen">
    <h1>말문에서의 경험, 한마디로 남겨주세요</h1>
    <p class="sub">이름과 나라, 그리고 짧은 한마디면 충분해요. 검토 후 홈페이지에 소개됩니다.</p>

    <div class="field">
      <label>이름 (닉네임도 좋아요)</label>
      <input id="f-name" placeholder="예: M.T.">
    </div>
    <div class="field">
      <label>나라 / 도시</label>
      <input id="f-country" placeholder="예: 홍콩">
    </div>
    <div class="field">
      <label>한마디 후기</label>
      <textarea id="f-body" placeholder="말문에서 배우면서 좋았던 점을 편하게 적어주세요."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitReview()">후기 보내기</button>
  </div>

  <div id="doneScreen">
    <div class="icon">🙏</div>
    <h2>감사합니다!</h2>
    <p>보내주신 후기는 확인 후<br>홈페이지에 소개될 예정이에요.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2200);
}

async function submitReview(){
  const name = document.getElementById('f-name').value.trim();
  const country = document.getElementById('f-country').value.trim();
  const body = document.getElementById('f-body').value.trim();

  if(!name || !body){ showToast('이름과 후기 내용을 입력해주세요'); return; }
  if(body.length > 500){ showToast('후기가 너무 길어요 (500자 이내)'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '보내는 중...';

  try{
    await db.collection('reviews').add({
      name, country, body,
      published: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('formScreen').style.display = 'none';
    document.getElementById('doneScreen').style.display = 'block';
  }catch(e){
    console.error(e);
    showToast('❌ 전송 실패: ' + e.message);
    btn.disabled = false;
    btn.textContent = '후기 보내기';
  }
}
</script>

</body>
</html>
