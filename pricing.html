<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요금제·패키지 | 말문 Malmun</title>
<meta name="description" content="말문의 한국어 1:1 튜터링 요금제와 패키지를 확인하세요. 첫 수업은 무료 오리엔테이션, 묶음 예약 시 더 저렴합니다.">
<link rel="canonical" href="https://malmunkorean.com/pricing.html">
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
    --accent-soft: rgba(224,153,58,0.06);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:0 20px 40px; }

  .topbar{ padding:24px 0 20px; display:flex; align-items:center; justify-content:space-between; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  #langToggle{
    background:none; border:0.5px solid rgba(255,255,255,0.15); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }

  .header{ padding:0 0 20px; }
  .header .title{ font-size:17px; font-weight:600; margin:0 0 6px; }
  .header .sub{ font-size:13px; color:var(--text-muted); margin:0; }

  .cards{ display:flex; flex-direction:column; gap:12px; }
  .price-card{
    border:0.5px solid rgba(255,255,255,0.15); border-radius:14px; padding:16px;
    background:none; text-align:left; width:100%; color:var(--text); cursor:pointer;
  }
  .price-card.featured{ border:2px solid var(--accent); background:var(--accent-soft); position:relative; }
  .badge{ position:absolute; top:-10px; left:16px; background:var(--accent); color:var(--accent-text); font-size:11px; font-weight:600; padding:3px 10px; border-radius:8px; }
  .price-card .name{ font-size:14px; font-weight:600; margin:8px 0 4px; }
  .price-card.featured .name{ color:#f0c98a; margin-top:8px; }
  .price-card .sub{ font-size:12px; color:var(--text-muted); margin:0 0 10px; }
  .price-card.featured .sub{ color:#c2a06a; }
  .price-card .amount{ font-size:18px; font-weight:600; }
  .price-card .unit{ font-size:12px; color:var(--text-muted); font-weight:400; }

  .note{ border:0.5px dashed rgba(255,255,255,0.12); border-radius:14px; padding:14px; margin-top:12px; }
  .note p{ font-size:12px; color:var(--text-muted); line-height:1.5; margin:0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='mypage.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button id="langToggle" aria-label="언어 전환">
      <span class="cur" id="langCur">한국어</span> / <span id="langOther">EN</span>
    </button>
  </div>

  <div class="header">
    <p class="title" data-i18n="pricing.h.title">요금제·패키지</p>
    <p class="sub" data-i18n="pricing.h.sub">묶어서 예약하면 회당 가격이 낮아져요</p>
  </div>

  <div class="cards">
    <button class="price-card" onclick="alert('단건 결제 흐름으로 이동합니다.')">
      <p class="name" data-i18n="pricing.single.name">단건 수업</p>
      <p class="sub" data-i18n="pricing.single.sub">부담 없이 한 번만</p>
      <p class="amount">₩28,000<span class="unit" data-i18n="pricing.single.unit"> /회</span></p>
    </button>

    <button class="price-card featured" onclick="alert('4회 패키지 결제 흐름으로 이동합니다.')">
      <div class="badge" data-i18n="pricing.popular">가장 많이 선택</div>
      <p class="name" data-i18n="pricing.pack4.name">4회 패키지</p>
      <p class="sub" data-i18n="pricing.pack4.sub">한 달 기준 · 회당 12% 할인</p>
      <p class="amount">₩98,560<span class="unit" data-i18n="pricing.pack4.unit"> · 회당 ₩24,640</span></p>
    </button>

    <button class="price-card" onclick="alert('12회 패키지 결제 흐름으로 이동합니다.')">
      <p class="name" data-i18n="pricing.pack12.name">12회 패키지</p>
      <p class="sub" data-i18n="pricing.pack12.sub">3개월 기준 · 회당 20% 할인</p>
      <p class="amount">₩268,800<span class="unit" data-i18n="pricing.pack12.unit"> · 회당 ₩22,400</span></p>
    </button>
  </div>

  <div class="note">
    <p data-i18n="pricing.note">패키지는 90일 내 자유롭게 사용, 미사용분은 환불 가능</p>
  </div>
</div>

<script>
const TRANSLATIONS = {
  ko: {
    "pricing.h.title": "요금제·패키지",
    "pricing.h.sub": "묶어서 예약하면 회당 가격이 낮아져요",
    "pricing.single.name": "단건 수업",
    "pricing.single.sub": "부담 없이 한 번만",
    "pricing.single.unit": " /회",
    "pricing.popular": "가장 많이 선택",
    "pricing.pack4.name": "4회 패키지",
    "pricing.pack4.sub": "한 달 기준 · 회당 12% 할인",
    "pricing.pack4.unit": " · 회당 ₩24,640",
    "pricing.pack12.name": "12회 패키지",
    "pricing.pack12.sub": "3개월 기준 · 회당 20% 할인",
    "pricing.pack12.unit": " · 회당 ₩22,400",
    "pricing.note": "패키지는 90일 내 자유롭게 사용, 미사용분은 환불 가능"
  },
  en: {
    "pricing.h.title": "Pricing & packages",
    "pricing.h.sub": "Bundle lessons for a lower rate per lesson",
    "pricing.single.name": "Single lesson",
    "pricing.single.sub": "No commitment, just one lesson",
    "pricing.single.unit": " /lesson",
    "pricing.popular": "Most popular",
    "pricing.pack4.name": "4-lesson pack",
    "pricing.pack4.sub": "1 month · 12% off per lesson",
    "pricing.pack4.unit": " · ₩24,640/lesson",
    "pricing.pack12.name": "12-lesson pack",
    "pricing.pack12.sub": "3 months · 20% off per lesson",
    "pricing.pack12.unit": " · ₩22,400/lesson",
    "pricing.note": "Use your package freely within 90 days — unused lessons are refundable"
  }
};

function applyLang(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  document.getElementById('langCur').textContent = (lang === 'ko') ? '한국어' : 'English';
  document.getElementById('langOther').textContent = (lang === 'ko') ? 'EN' : '한글';
  localStorage.setItem('malmun_lang', lang);
}

(function initLang(){
  const saved = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(saved);
})();

document.getElementById('langToggle').addEventListener('click', () => {
  const current = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(current === 'ko' ? 'en' : 'ko');
});
</script>

</body>
</html>
