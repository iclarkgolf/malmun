<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 말문</title>
<style>
  :root{
    --bg: #FFF9F0;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --card-border: #E8E4D8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:420px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ padding:24px 0 20px; display:flex; align-items:center; justify-content:space-between; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  #langToggle{
    background:none; border:1px solid var(--card-border); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }

  .center{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 0 40px; }
  .brand{ font-size:14px; font-weight:600; text-align:center; margin:0 0 6px; }
  .title{ font-size:20px; font-weight:600; text-align:center; margin:0 0 6px; }
  .subtitle{ font-size:13px; color:var(--text-muted); text-align:center; margin:0 0 32px; }

  .oauth-btn{
    width:100%; border:1px solid var(--card-border); border-radius:10px;
    padding:14px; text-align:center; font-size:14px; color:var(--text);
    margin-bottom:10px; cursor:pointer; background:#fff; display:flex; align-items:center; justify-content:center; gap:8px;
  }

  .divider{ display:flex; align-items:center; gap:10px; margin:16px 0; }
  .divider .line{ flex:1; height:1px; background:var(--card-border); }
  .divider span{ font-size:11px; color:var(--text-muted); }

  .tabs{ display:flex; gap:4px; background:var(--card-border); border-radius:10px; padding:4px; margin-bottom:14px; }
  .tab{
    flex:1; border:none; background:none; padding:9px; border-radius:7px;
    font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer;
  }
  .tab.active{ background:#fff; color:var(--text); }

  .field{ border:1px solid var(--card-border); border-radius:10px; padding:10px 14px; margin-bottom:10px; background:#fff; }
  .field label{ font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px; }
  .field input{
    width:100%; background:none; border:none; color:var(--text);
    font-size:14px; padding:0; outline:none;
  }
  .field input::placeholder{ color:#b8b4a8; }

  .submit-btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text); margin:10px 0 16px;
  }
  .terms{ font-size:12px; color:var(--text-muted); text-align:center; margin:0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="history.back()" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button id="langToggle" aria-label="언어 전환">
      <span class="cur" id="langCur">한국어</span> / <span id="langOther">EN</span>
    </button>
  </div>

  <div class="center">
    <p class="brand">말문</p>
    <p class="title" data-i18n="login.title">시작해볼까요</p>
    <p class="subtitle" id="subtitleText" data-i18n="login.subtitle">가입 없이 레벨테스트는 이미 완료하셨어요</p>

    <button class="oauth-btn" onclick="handleOAuth('google')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login.google">Google로 계속하기</span>
    </button>
    <button class="oauth-btn" onclick="handleOAuth('apple')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#2C2C2A"><path d="M16.365 1.43c0 1.14-.468 2.198-1.24 2.98-.84.87-2.144 1.54-3.19 1.45-.13-1.11.42-2.27 1.19-3.02.83-.83 2.24-1.44 3.24-1.41zM20.66 17.15c-.42.98-.93 1.94-1.67 2.81-.98 1.18-1.95 2.34-3.5 2.36-1.5.03-1.98-.9-3.7-.9-1.71 0-2.25.87-3.68.93-1.5.06-2.64-1.28-3.63-2.45-1.98-2.4-3.5-6.78-1.46-9.74.99-1.45 2.76-2.36 4.6-2.4 1.44-.02 2.8.98 3.68.98.87 0 2.52-1.2 4.25-1.03.72.03 2.75.3 4.05 2.22-.1.07-2.42 1.42-2.4 4.22.03 3.35 2.93 4.46 2.96 4.47z"/></svg>
      <span data-i18n="login.apple">Apple로 계속하기</span>
    </button>

    <div class="divider"><div class="line"></div><span data-i18n="login.or">또는</span><div class="line"></div></div>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')" data-i18n="login.tab.login">로그인</button>
      <button class="tab" id="tabSignup" onclick="switchTab('signup')" data-i18n="login.tab.signup">회원가입</button>
    </div>

    <div class="field">
      <label data-i18n="login.email">이메일</label>
      <input type="email" placeholder="name@example.com" id="emailInput">
    </div>
    <div class="field">
      <label data-i18n="login.password">비밀번호</label>
      <input type="password" placeholder="••••••••" id="passwordInput">
    </div>

    <button class="submit-btn" id="submitBtn" onclick="handleEmailLogin()">로그인</button>
    <p class="terms" data-i18n="login.terms">계속 진행하면 이용약관과 개인정보처리방침에 동의하게 됩니다</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

async function saveUserProfile(user){
  try{
    await db.collection('users').doc(user.uid).set({
      email: user.email,
      displayName: user.displayName || '',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  }catch(err){
    console.error('사용자 정보 저장 실패:', err);
  }
}

async function migratePendingHistory(uid){
  const pending = localStorage.getItem('malmun_pending_history');
  if(!pending) return;
  try{
    const entry = JSON.parse(pending);
    await db.collection('users').doc(uid).collection('history').add({
      ...entry,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.removeItem('malmun_pending_history');
  }catch(err){
    console.error('히스토리 이관 실패:', err);
  }
}
</script>
<script>
const TRANSLATIONS = {
  ko: {
    "login.title": "시작해볼까요",
    "login.subtitle": "가입 없이 레벨테스트는 이미 완료하셨어요",
    "login.subtitle.booking": "로그인하고 예약을 마무리해요",
    "login.google": "Google로 계속하기",
    "login.apple": "Apple로 계속하기",
    "login.or": "또는",
    "login.email": "이메일",
    "login.password": "비밀번호",
    "login.continue": "로그인",
    "login.continue.signup": "회원가입",
    "login.tab.login": "로그인",
    "login.tab.signup": "회원가입",
    "login.terms": "계속 진행하면 이용약관과 개인정보처리방침에 동의하게 됩니다"
  },
  en: {
    "login.title": "Let's get started",
    "login.subtitle": "No sign-up needed — you've already finished the level test",
    "login.subtitle.booking": "Log in to finish your booking",
    "login.google": "Continue with Google",
    "login.apple": "Continue with Apple",
    "login.or": "or",
    "login.email": "Email",
    "login.password": "Password",
    "login.continue": "Log in",
    "login.continue.signup": "Sign up",
    "login.tab.login": "Log in",
    "login.tab.signup": "Sign up",
    "login.terms": "By continuing you agree to the Terms of Service and Privacy Policy"
  }
};

const params = new URLSearchParams(window.location.search);
const next = params.get('next');
let currentMode = 'login';

function updateSubmitBtnText(){
  const lang = localStorage.getItem('malmun_lang') || 'ko';
  const key = (currentMode === 'signup') ? 'login.continue.signup' : 'login.continue';
  document.getElementById('submitBtn').textContent = TRANSLATIONS[lang][key];
}

function switchTab(mode){
  currentMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  updateSubmitBtnText();
}

function applyLang(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  const subtitleKey = (next === 'booking') ? 'login.subtitle.booking' : 'login.subtitle';
  document.getElementById('subtitleText').innerHTML = TRANSLATIONS[lang][subtitleKey];
  document.getElementById('langCur').textContent = (lang === 'ko') ? '한국어' : 'English';
  document.getElementById('langOther').textContent = (lang === 'ko') ? 'EN' : '한글';
  localStorage.setItem('malmun_lang', lang);
  updateSubmitBtnText();
}

(function initLang(){
  const saved = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(saved);
})();

document.getElementById('langToggle').addEventListener('click', () => {
  const current = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(current === 'ko' ? 'en' : 'ko');
});

function afterLogin(){
  if(next === 'booking'){
    const tutor = params.get('tutor');
    location.href = tutor ? ('booking.html?tutor=' + tutor) : 'booking.html';
  } else {
    location.href = 'mypage.html';
  }
}

async function handleOAuth(provider){
  if(provider === 'apple'){
    alert('Apple 로그인은 아직 준비 중입니다. Google 또는 이메일로 계속해주세요.');
    return;
  }
  const googleProvider = new firebase.auth.GoogleAuthProvider();
  try{
    const result = await auth.signInWithPopup(googleProvider);
    await saveUserProfile(result.user);
    await migratePendingHistory(result.user.uid);
    afterLogin();
  }catch(err){
    console.error(err);
    alert('로그인에 실패했습니다: ' + err.message);
  }
}

async function handleEmailLogin(){
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if(!email || !password){
    alert('이메일과 비밀번호를 모두 입력해주세요.');
    return;
  }
  if(currentMode === 'signup'){
    try{
      const result = await auth.createUserWithEmailAndPassword(email, password);
      await saveUserProfile(result.user);
      await migratePendingHistory(result.user.uid);
      afterLogin();
    }catch(err){
      if(err.code === 'auth/email-already-in-use'){
        alert('이미 가입된 이메일입니다. 로그인 탭에서 로그인해주세요.');
      } else {
        alert('가입에 실패했습니다: ' + err.message);
      }
    }
  } else {
    try{
      const result = await auth.signInWithEmailAndPassword(email, password);
      await migratePendingHistory(result.user.uid);
      afterLogin();
    }catch(err){
      if(err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential'){
        alert('가입되지 않은 이메일입니다. 회원가입 탭을 이용해주세요.');
      } else {
        alert('로그인에 실패했습니다: ' + err.message);
      }
    }
  }
}
</script>

</body>
</html>
