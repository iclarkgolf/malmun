<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:420px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ padding:24px 0 20px; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }

  .center{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 0 40px; }
  .brand{ font-size:14px; font-weight:600; text-align:center; margin:0 0 6px; }
  .title{ font-size:20px; font-weight:600; text-align:center; margin:0 0 6px; }
  .subtitle{ font-size:13px; color:var(--text-muted); text-align:center; margin:0 0 32px; }

  .oauth-btn{
    width:100%; border:0.5px solid rgba(255,255,255,0.15); border-radius:10px;
    padding:14px; text-align:center; font-size:14px; color:#e5e4dd;
    margin-bottom:10px; cursor:pointer; background:none; display:flex; align-items:center; justify-content:center; gap:8px;
  }

  .divider{ display:flex; align-items:center; gap:10px; margin:16px 0; }
  .divider .line{ flex:1; height:0.5px; background:rgba(255,255,255,0.12); }
  .divider span{ font-size:11px; color:#5a5852; }

  .field{ border:0.5px solid rgba(255,255,255,0.15); border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .field label{ font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px; }
  .field input{
    width:100%; background:none; border:none; color:var(--text);
    font-size:14px; padding:0; outline:none;
  }
  .field input::placeholder{ color:#5a5852; }

  .submit-btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text); margin:10px 0 16px;
  }
  .terms{ font-size:12px; color:var(--text-muted); text-align:center; margin:0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="history.back()" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="center">
    <p class="brand">말문</p>
    <p class="title">시작해볼까요</p>
    <p class="subtitle" id="subtitleText">가입 없이 레벨테스트는 이미 완료하셨어요</p>

    <button class="oauth-btn" onclick="handleOAuth('google')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 계속하기
    </button>
    <button class="oauth-btn" onclick="handleOAuth('apple')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#e5e4dd"><path d="M16.365 1.43c0 1.14-.468 2.198-1.24 2.98-.84.87-2.144 1.54-3.19 1.45-.13-1.11.42-2.27 1.19-3.02.83-.83 2.24-1.44 3.24-1.41zM20.66 17.15c-.42.98-.93 1.94-1.67 2.81-.98 1.18-1.95 2.34-3.5 2.36-1.5.03-1.98-.9-3.7-.9-1.71 0-2.25.87-3.68.93-1.5.06-2.64-1.28-3.63-2.45-1.98-2.4-3.5-6.78-1.46-9.74.99-1.45 2.76-2.36 4.6-2.4 1.44-.02 2.8.98 3.68.98.87 0 2.52-1.2 4.25-1.03.72.03 2.75.3 4.05 2.22-.1.07-2.42 1.42-2.4 4.22.03 3.35 2.93 4.46 2.96 4.47z"/></svg>
      Apple로 계속하기
    </button>

    <div class="divider"><div class="line"></div><span>또는</span><div class="line"></div></div>

    <div class="field">
      <label>이메일</label>
      <input type="email" placeholder="name@example.com" id="emailInput">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" placeholder="••••••••" id="passwordInput">
    </div>

    <button class="submit-btn" onclick="handleEmailLogin()">계속하기</button>
    <p class="terms">계속 진행하면 이용약관과 개인정보처리방침에 동의하게 됩니다</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  if(next === 'booking'){
    document.getElementById('subtitleText').textContent = '로그인하고 예약을 마무리해요';
  }

  function afterLogin(){
    if(next === 'booking'){
      location.href = 'booking.html';
    } else {
      location.href = 'mypage.html';
    }
  }

  function handleOAuth(provider){
    // 실제 서비스에서는 OAuth 연동 로직 연결
    console.log(provider + ' 로그인 시도');
    afterLogin();
  }

  function handleEmailLogin(){
    const email = document.getElementById('emailInput').value;
    if(!email){
      alert('이메일을 입력해주세요.');
      return;
    }
    afterLogin();
  }
</script>

</body>
</html>
