<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
    --accent-soft: rgba(224,153,58,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:24px 20px 40px; }

  .profile-row{ display:flex; align-items:center; gap:12px; padding:0 0 20px; }
  .top-row{ display:flex; justify-content:flex-end; padding:0 0 12px; }
  #langToggle{
    background:none; border:0.5px solid rgba(255,255,255,0.15); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }
  .avatar{ width:44px; height:44px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--accent-text); }
  .profile-row .name{ font-size:15px; font-weight:600; margin:0; }
  .profile-row .sub{ font-size:12px; color:var(--text-muted); margin:2px 0 0; }

  .next-lesson{
    background:var(--accent-soft); border:0.5px solid rgba(224,153,58,0.3);
    border-radius:14px; padding:16px; margin-bottom:20px; cursor:pointer; border-width:0.5px; width:100%; text-align:left;
  }
  .next-lesson .tag{ font-size:11px; color:var(--accent); margin:0 0 8px; }
  .next-lesson .row{ display:flex; justify-content:space-between; align-items:center; }
  .next-lesson .lesson-name{ font-size:14px; margin:0 0 3px; }
  .next-lesson .lesson-time{ font-size:12px; color:#c2a06a; margin:0; }

  .stats{ display:flex; gap:10px; margin-bottom:20px; }
  .stat-card{ flex:1; background:var(--card); border-radius:12px; padding:14px; text-align:center; }
  .stat-card .num{ font-size:20px; font-weight:600; margin:0; }
  .stat-card .label{ font-size:11px; color:var(--text-muted); margin:4px 0 0; }

  .menu-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:0.5px solid var(--card-border);
    cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; color:var(--text);
  }
  .menu-item span{ font-size:13px; color:#e5e4dd; }
  .menu-item:last-child{ border-bottom:none; }

  body{ padding-bottom:76px; }
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(20,22,27,0.92); backdrop-filter:blur(10px);
    border-top:0.5px solid var(--card-border);
    display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 0; color:var(--text-muted); background:none; border:none; cursor:pointer;
  }
  .nav-item.active{ color:var(--accent); }
  .nav-item span{ font-size:11px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <button id="langToggle" aria-label="언어 전환">
      <span class="cur" id="langCur">한국어</span> / <span id="langOther">EN</span>
    </button>
  </div>

  <div class="profile-row">
    <div class="avatar">M</div>
    <div>
      <p class="name">Maria</p>
      <p class="sub" data-i18n="mypage.level">중급 2단계 · 8회 수업 완료</p>
    </div>
  </div>

  <button class="next-lesson" onclick="alert('예약된 수업 상세/입장 화면으로 이동합니다.')">
    <p class="tag" data-i18n="mypage.nextLesson">다음 수업</p>
    <div class="row">
      <div>
        <p class="lesson-name" data-i18n="mypage.lessonName">지은 튜터 · 비즈니스 회화</p>
        <p class="lesson-time" data-i18n="mypage.lessonTime">수 19:00 · 50분</p>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e0993a" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </div>
  </button>

  <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;" data-i18n="mypage.monthly">이번 달 학습 현황</p>
  <div class="stats">
    <div class="stat-card"><p class="num">6</p><p class="label" data-i18n="mypage.completed">완료한 수업</p></div>
    <div class="stat-card"><p class="num">62%</p><p class="label" data-i18n="mypage.progress">3단계 진도율</p></div>
  </div>

  <button class="menu-item" onclick="alert('수업 내역/후기작성 화면으로 이동합니다.')">
    <span data-i18n="mypage.history">수업 내역</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7a7871" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <button class="menu-item" onclick="location.href='pricing.html'">
    <span data-i18n="mypage.pricing">요금제·패키지</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7a7871" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <button class="menu-item" onclick="alert('결제 수단 관리 화면으로 이동합니다.')">
    <span data-i18n="mypage.payment">결제 수단</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7a7871" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='index.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span data-i18n="nav.home">홈</span>
  </button>
  <button class="nav-item" onclick="location.href='tutors.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span data-i18n="nav.tutors">튜터</span>
  </button>
  <button class="nav-item" onclick="location.href='curriculum.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    <span data-i18n="nav.curriculum">커리큘럼</span>
  </button>
  <button class="nav-item" onclick="location.href='blog.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span data-i18n="nav.community">커뮤니티</span>
  </button>
  <button class="nav-item active" onclick="location.href='mypage.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span data-i18n="nav.mypage">마이페이지</span>
  </button>
</nav>

<script>
const TRANSLATIONS = {
  ko: {
    "mypage.level": "중급 2단계 · 8회 수업 완료",
    "mypage.nextLesson": "다음 수업",
    "mypage.lessonName": "지은 튜터 · 비즈니스 회화",
    "mypage.lessonTime": "수 19:00 · 50분",
    "mypage.monthly": "이번 달 학습 현황",
    "mypage.completed": "완료한 수업",
    "mypage.progress": "3단계 진도율",
    "mypage.history": "수업 내역",
    "mypage.pricing": "요금제·패키지",
    "mypage.payment": "결제 수단",
    "nav.home": "홈", "nav.tutors": "튜터", "nav.curriculum": "커리큘럼",
    "nav.community": "커뮤니티", "nav.mypage": "마이페이지"
  },
  en: {
    "mypage.level": "Intermediate stage 2 · 8 lessons completed",
    "mypage.nextLesson": "Next lesson",
    "mypage.lessonName": "Tutor Jieun · Business Korean",
    "mypage.lessonTime": "Wed 7:00 PM · 50 min",
    "mypage.monthly": "This month's progress",
    "mypage.completed": "Lessons completed",
    "mypage.progress": "Stage 3 progress",
    "mypage.history": "Lesson history",
    "mypage.pricing": "Pricing & packages",
    "mypage.payment": "Payment methods",
    "nav.home": "Home", "nav.tutors": "Tutors", "nav.curriculum": "Curriculum",
    "nav.community": "Community", "nav.mypage": "My page"
  }
};

function applyLang(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  document.getElementById('langCur').textContent = (lang === 'ko') ? '한국어' : 'English';
  document.getElementById('langOther').textContent = (lang === 'ko') ? 'EN' : '한글';
  localStorage.setItem('malmun_lang', lang);
}

(function initLang(){
  const saved = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(saved);
})();

document.getElementById('langToggle').addEventListener('click', () => {
  const current = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(current === 'ko' ? 'en' : 'ko');
});
</script></body>
</html>
