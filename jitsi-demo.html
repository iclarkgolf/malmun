<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말문 화상수업 데모 (Jitsi)</title>
<style>
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#FAF7EF; }
  header{ padding:16px 20px; text-align:center; }
  header h1{ font-size:18px; margin:0 0 4px; }
  header p{ font-size:13px; color:#6b6a63; margin:0; }
  #meet{ width:100%; height:520px; }
  .note{ max-width:640px; margin:16px auto; padding:0 20px; font-size:13px; color:#6b6a63; line-height:1.6; }
</style>
</head>
<body>

<header>
  <h1>말문 화상수업 데모 (Jitsi Meet 임베드)</h1>
  <p>가입 없이 바로 뜨는 화상통화 화면입니다. 카메라/마이크 권한만 허용해보세요.</p>
</header>

<div id="meet"></div>

<div class="note">
  이 페이지를 폰에서 열어서 같은 화면으로 들어와보시면, PC와 폰이 실제로 화상으로 연결되는지 확인하실 수 있습니다.
  방 이름은 코드에 고정돼 있어서(malmun-demo-room), 같은 링크로 여러 명이 들어오면 같은 방에서 만나게 됩니다.
</div>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
  const domain = 'meet.jit.si';
  const options = {
    roomName: 'malmun-demo-room-iclarkgolf-pj',
    width: '100%',
    height: 520,
    parentNode: document.querySelector('#meet'),
    userInfo: { displayName: '테스트' },
    configOverwrite: {
      startWithAudioMuted: false,
      startWithVideoMuted: false,
      prejoinPageEnabled: true
    },
    interfaceConfigOverwrite: {
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false
    }
  };
  const api = new JitsiMeetExternalAPI(domain, options);
</script>

</body>
</html>
