<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 예약 | 말문</title>
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:24px 0 16px; gap:10px; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  .topbar .title{ font-size:14px; font-weight:600; }
  #langToggle{
    background:none; border:1px solid var(--card-border); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }

  .tutor-summary{ display:flex; align-items:center; gap:12px; padding:0 0 20px; }
  .tutor-summary .avatar{ width:40px; height:40px; border-radius:50%; background:#3b5f8f; flex-shrink:0; }
  .tutor-summary p{ margin:0; }
  .tutor-summary .main{ font-size:14px; color:var(--text); }
  .tutor-summary .sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }

  .label{ font-size:12px; color:var(--text-secondary); margin:0 0 10px; }
  .days{ display:flex; gap:8px; flex-wrap:wrap; padding:0 0 18px; }
  .day{
    border:1px solid var(--card-border); color:var(--text-secondary);
    font-size:13px; padding:9px 12px; border-radius:10px; cursor:pointer; background:#fff; min-width:44px; text-align:center;
  }
  .day.selected{ background:var(--accent); color:var(--accent-text); border:none; font-weight:600; }

  .slots{ display:flex; gap:8px; flex-wrap:wrap; padding:0 0 24px; }
  .slot{
    border:1px solid var(--card-border); color:var(--text-secondary);
    font-size:13px; padding:9px 14px; border-radius:10px; cursor:pointer; background:#fff;
  }
  .slot.selected{ background:var(--accent); color:var(--accent-text); border:none; font-weight:600; }

  .login-gate{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px; margin-bottom:24px; }
  .login-gate p{ font-size:13px; color:var(--text); margin:0 0 12px; }
  .login-option{
    border:1px solid var(--card-border); border-radius:10px; padding:12px;
    text-align:center; font-size:13px; color:var(--text); margin-bottom:8px; cursor:pointer; background:#fff; width:100%;
  }

  .summary{ margin-top:auto; padding:14px 0 32px; border-top:0.5px solid var(--card-border); }
  .summary-row{ display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; }
  .summary-row.discount{ color:var(--accent); margin-bottom:14px; }
  .summary-row .label2{ color:var(--text-secondary); }
  .pay-btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text);
  }
  .pay-btn:disabled{ background:#e8e4d8; color:#a8a49a; cursor:not-allowed; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='tutor-profile.html?id=' + currentTutorId" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <span class="title" data-i18n="booking.title">수업 예약</span>
    <button id="langToggle" aria-label="언어 전환">
      <span class="cur" id="langCur">한국어</span> / <span id="langOther">EN</span>
    </button>
  </div>

  <div class="tutor-summary">
    <div class="avatar" id="tutorAvatar"></div>
    <div>
      <p class="main" id="tutorSummaryName">지은 튜터와 1회 수업</p>
      <p class="sub" id="tutorSummaryType">비즈니스 한국어 · 50분</p>
    </div>
  </div>

  <p class="label" data-i18n="booking.chooseDay">요일 선택</p>
  <div class="days" id="days"></div>

  <p class="label" data-i18n="booking.chooseTime">시간 선택</p>
  <div class="slots" id="slots"></div>

  <div class="login-gate" id="loginGate">
    <p data-i18n="booking.loginNeeded">예약을 완료하려면 로그인이 필요해요</p>
    <button class="login-option" id="googleLoginBtn" style="display:flex; align-items:center; justify-content:center; gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="booking.google">Google로 계속하기</span>
    </button>
    <button class="login-option" id="emailLoginBtn">
      <span data-i18n="booking.email">이메일로 계속하기</span>
    </button>
  </div>

  <div class="summary">
    <div class="summary-row"><span class="label2" data-i18n="booking.fee">수업료</span><span id="feeText">₩28,000</span></div>
    <div class="summary-row discount"><span data-i18n="booking.discount">첫 수업 10% 할인</span><span id="discountText">-₩2,800</span></div>
    <button class="pay-btn" id="payBtn" data-i18n="booking.pay">₩25,200 결제하고 예약 확정</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---- Tutor data (kept in sync with tutor-profile.html) ----
const TUTORS = {
  jieun: {
    avatarColor: '#3b5f8f', price: 28000,
    ko: { name: '지은', type: '비즈니스 한국어 · 50분' },
    en: { name: 'Jieun', type: 'Business Korean · 50 min' }
  },
  hyunwoo: {
    avatarColor: '#6a4f8f', price: 24000,
    ko: { name: '현우', type: 'TOPIK 문법·어휘 · 50분' },
    en: { name: 'Hyunwoo', type: 'TOPIK Grammar & Vocabulary · 50 min' }
  },
  soojin: {
    avatarColor: '#8f4f5f', price: 22000,
    ko: { name: '수진', type: '일상 회화 · 50분' },
    en: { name: 'Soojin', type: 'Everyday Conversation · 50 min' }
  }
};

const urlParams = new URLSearchParams(window.location.search);
const requested = urlParams.get('tutor') || urlParams.get('id');
const currentTutorId = TUTORS[requested] ? requested : 'jieun';

// ---- Day / time slot data ----
const DAYS = [
  { id: 'mon', ko: '월', en: 'Mon' },
  { id: 'tue', ko: '화', en: 'Tue' },
  { id: 'wed', ko: '수', en: 'Wed' },
  { id: 'thu', ko: '목', en: 'Thu' },
  { id: 'fri', ko: '금', en: 'Fri' },
  { id: 'sat', ko: '토', en: 'Sat' }
];
const TIMES = ['10:00', '14:00', '17:00', '19:00', '21:00'];

let selectedDay = null;
let selectedTime = null;
let currentLang = localStorage.getItem('malmun_lang') || 'ko';

function fmtKRW(n){ return '₩' + n.toLocaleString('en-US'); }

function renderDays(){
  const container = document.getElementById('days');
  container.innerHTML = '';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day' + (selectedDay === d.id ? ' selected' : '');
    btn.textContent = currentLang === 'ko' ? d.ko : d.en;
    btn.addEventListener('click', () => { selectedDay = d.id; renderDays(); updatePayState(); });
    container.appendChild(btn);
  });
}

function renderSlots(){
  const container = document.getElementById('slots');
  container.innerHTML = '';
  TIMES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'slot' + (selectedTime === t ? ' selected' : '');
    btn.textContent = t;
    btn.addEventListener('click', () => { selectedTime = t; renderSlots(); updatePayState(); });
    container.appendChild(btn);
  });
}

function updatePayState(){
  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = !(selectedDay && selectedTime);
}

function renderTutorSummary(){
  const t = TUTORS[currentTutorId];
  const d = t[currentLang] || t.ko;
  document.getElementById('tutorAvatar').style.background = t.avatarColor;
  const withText = currentLang === 'ko' ? `${d.name} 튜터와 1회 수업` : `1 lesson with tutor ${d.name}`;
  document.getElementById('tutorSummaryName').textContent = withText;
  document.getElementById('tutorSummaryType').textContent = d.type;

  const price = t.price;
  const discount = Math.round(price * 0.1);
  const finalPrice = price - discount;
  document.getElementById('feeText').textContent = fmtKRW(price);
  document.getElementById('discountText').textContent = '-' + fmtKRW(discount);
  const payLabel = currentLang === 'ko'
    ? `${fmtKRW(finalPrice)} 결제하고 예약 확정`
    : `Pay ${fmtKRW(finalPrice)} and confirm booking`;
  document.getElementById('payBtn').textContent = payLabel;
}

const TRANSLATIONS = {
  ko: {
    "booking.title": "수업 예약",
    "booking.chooseDay": "요일 선택",
    "booking.chooseTime": "시간 선택",
    "booking.loginNeeded": "예약을 완료하려면 로그인이 필요해요",
    "booking.google": "Google로 계속하기",
    "booking.email": "이메일로 계속하기",
    "booking.fee": "수업료",
    "booking.discount": "첫 수업 10% 할인"
  },
  en: {
    "booking.title": "Book a lesson",
    "booking.chooseDay": "Choose a day",
    "booking.chooseTime": "Choose a time",
    "booking.loginNeeded": "Log in to complete your booking",
    "booking.google": "Continue with Google",
    "booking.email": "Continue with email",
    "booking.fee": "Lesson fee",
    "booking.discount": "First lesson 10% off"
  }
};

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  document.getElementById('langCur').textContent = (lang === 'ko') ? '한국어' : 'English';
  document.getElementById('langOther').textContent = (lang === 'ko') ? 'EN' : '한글';
  localStorage.setItem('malmun_lang', lang);
  renderDays();
  renderSlots();
  renderTutorSummary();
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLang(currentLang === 'ko' ? 'en' : 'ko');
});

document.getElementById('googleLoginBtn').addEventListener('click', () => {
  location.href = 'login.html?next=booking&tutor=' + currentTutorId;
});
document.getElementById('emailLoginBtn').addEventListener('click', () => {
  location.href = 'login.html?next=booking&method=email&tutor=' + currentTutorId;
});

async function handleConfirm(){
  if(!selectedDay || !selectedTime) return;
  const user = auth.currentUser;
  if(!user){
    location.href = 'login.html?next=booking&tutor=' + currentTutorId;
    return;
  }
  const t = TUTORS[currentTutorId];
  const dayObj = DAYS.find(d => d.id === selectedDay);
  const dayLabel = currentLang === 'ko' ? dayObj.ko : dayObj.en;
  const tutorName = (t[currentLang] || t.ko).name;
  try{
    await db.collection('users').doc(user.uid).collection('bookings').add({
      tutorId: currentTutorId,
      tutorName: tutorName,
      day: selectedDay,
      time: selectedTime,
      price: t.price,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(user.uid).collection('history').add({
      type: 'booking',
      text: currentLang === 'ko' ? `${tutorName} 튜터 예약 완료` : `Booked a lesson with ${tutorName}`,
      sub: `${dayLabel} ${selectedTime}`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert(currentLang === 'ko' ? '예약이 확정되었습니다!' : 'Your booking is confirmed!');
    location.href = 'mypage.html';
  }catch(err){
    console.error('예약 저장 실패:', err);
    alert((currentLang === 'ko' ? '예약 중 오류가 발생했습니다: ' : 'Something went wrong: ') + err.message);
  }
}

document.getElementById('payBtn').addEventListener('click', handleConfirm);

auth.onAuthStateChanged((user) => {
  document.getElementById('loginGate').style.display = user ? 'none' : 'block';
});

applyLang(currentLang);
updatePayState();
</script>

</body>
</html>
