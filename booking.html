<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 예약 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:24px 0 16px; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  .topbar .title{ font-size:14px; font-weight:600; }

  .tutor-summary{ display:flex; align-items:center; gap:12px; padding:0 0 20px; }
  .tutor-summary .avatar{ width:40px; height:40px; border-radius:50%; background:#3b5f8f; flex-shrink:0; }
  .tutor-summary p{ margin:0; }
  .tutor-summary .main{ font-size:14px; }
  .tutor-summary .sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }

  .label{ font-size:12px; color:var(--text-secondary); margin:0 0 10px; }
  .slots{ display:flex; gap:8px; flex-wrap:wrap; padding:0 0 24px; }
  .slot{
    border:0.5px solid rgba(255,255,255,0.15); color:var(--text-secondary);
    font-size:13px; padding:9px 14px; border-radius:10px; cursor:pointer; background:none;
  }
  .slot.selected{ background:var(--accent); color:var(--accent-text); border:none; font-weight:600; }

  .login-gate{ background:var(--card); border-radius:14px; padding:16px; margin-bottom:24px; }
  .login-gate p{ font-size:13px; color:#e5e4dd; margin:0 0 12px; }
  .login-option{
    border:0.5px solid rgba(255,255,255,0.15); border-radius:10px; padding:12px;
    text-align:center; font-size:13px; color:#e5e4dd; margin-bottom:8px; cursor:pointer; background:none; width:100%;
  }

  .summary{ margin-top:auto; padding:14px 0 32px; border-top:0.5px solid var(--card-border); }
  .summary-row{ display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; }
  .summary-row.discount{ color:var(--accent); margin-bottom:14px; }
  .summary-row .label2{ color:var(--text-secondary); }
  .pay-btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='tutor-profile.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <span class="title">수업 예약</span>
    <span style="width:18px;"></span>
  </div>

  <div class="tutor-summary">
    <div class="avatar"></div>
    <div>
      <p class="main">지은 튜터와 1회 수업</p>
      <p class="sub">비즈니스 한국어 · 50분</p>
    </div>
  </div>

  <p class="label">시간 선택</p>
  <div class="slots" id="slots">
    <button class="slot" data-slot="tue20">화 20:00</button>
    <button class="slot selected" data-slot="wed19">수 19:00</button>
    <button class="slot" data-slot="thu21">목 21:00</button>
  </div>

  <div class="login-gate">
    <p>예약을 완료하려면 로그인이 필요해요</p>
    <button class="login-option" onclick="location.href='login.html?next=booking'">
      Google로 계속하기
    </button>
    <button class="login-option" onclick="location.href='login.html?next=booking&method=email'">
      이메일로 계속하기
    </button>
  </div>

  <div class="summary">
    <div class="summary-row"><span class="label2">수업료</span><span>₩28,000</span></div>
    <div class="summary-row discount"><span>첫 수업 10% 할인</span><span>-₩2,800</span></div>
    <button class="pay-btn" onclick="alert('로그인 후 결제가 진행됩니다.')">₩25,200 결제하고 예약 확정</button>
  </div>
</div>

<script>
  const slots = document.querySelectorAll('.slot');
  slots.forEach(slot => {
    slot.addEventListener('click', () => {
      slots.forEach(s => s.classList.remove('selected'));
      slot.classList.add('selected');
    });
  });
</script>

</body>
</html>
