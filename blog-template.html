<!DOCTYPE html>
<!--
  말문 블로그 새 글 만드는 법 (iCLARKGOLF와 동일한 3단계 방식)
  1. 사진 업로드: GitHub → images/ 폴더 → blog-[번호]-hero.jpg
  2. 이 파일을 복사해서 blog-[번호].html 로 저장, 아래 [ ] 부분을 실제 내용으로 교체
  3. posts-data.js 맨 위에 새 글 한 줄 추가
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[글 제목] | 말문 Malmun</title>
<meta name="description" content="[글 요약 1~2문장]">
<link rel="canonical" href="https://malmunkorean.com/blog-[번호].html">
<style>
  :root{
    --bg:#FFF9F0; --card:#FFFFFF; --card-border:#E8E4D8;
    --text:#2C2C2A; --text-secondary:#5F5E5A; --text-muted:#8A8880;
    --accent:#EF9F27; --accent-text:#412402; --accent-soft:#FFF3E0; --coral:#D85A30;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:76px; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:600px; margin:0 auto; padding:0 20px 32px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 0; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  #langToggle{ background:none; border:1px solid var(--card-border); color:var(--text-secondary); border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; }

  .post-category{ display:inline-block; background:var(--accent-soft); color:var(--coral); font-size:11px; font-weight:700; padding:4px 10px; border-radius:10px; margin-bottom:10px; }
  .post-title{ font-size:22px; font-weight:700; line-height:1.4; margin:0 0 10px; }
  .post-meta{ font-size:12px; color:var(--text-muted); margin-bottom:18px; }

  .post-thumb{ width:100%; border-radius:14px; overflow:hidden; margin-bottom:20px; background:var(--accent-soft); }
  .post-thumb img{ width:100%; display:block; }

  .post-body{ font-size:15px; line-height:1.9; color:var(--text); }
  .post-body p{ margin:0 0 18px; }
  .post-body h2{ font-size:17px; font-weight:700; margin:30px 0 12px; }

  .story-box{ background:var(--accent-soft); border-left:4px solid var(--coral); border-radius:12px; padding:18px 20px; margin:22px 0; }
  .story-box .label{ font-size:11px; font-weight:700; letter-spacing:1px; color:var(--coral); margin-bottom:8px; }
  .story-box p{ font-size:14px; margin:0; color:var(--text); }

  .tip-box{ background:var(--card); border:1px solid var(--card-border); border-left:4px solid var(--accent); border-radius:12px; padding:18px 20px; margin:22px 0; }
  .tip-box .tip-title{ font-weight:700; font-size:14px; margin-bottom:10px; }

  .related-posts{ margin:32px 0 24px; }
  .related-posts h3{ font-size:15px; font-weight:700; margin:0 0 14px; padding-bottom:8px; border-bottom:2px solid var(--accent-soft); }
  .related-grid{ display:grid; gap:10px; }
  .related-grid a{ display:block; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:12px 14px; font-size:13px; font-weight:600; }

  .cta-box{ background:var(--coral); border-radius:16px; padding:28px 24px; text-align:center; margin-top:24px; }
  .cta-box p{ color:#FFF3EC; font-size:14px; margin:0 0 16px; }
  .cta-box a{ display:inline-block; background:var(--accent); color:var(--accent-text); font-weight:700; font-size:14px; padding:13px 28px; border-radius:50px; }

  body{ padding-bottom:76px; }
  .bottom-nav{ position:fixed; bottom:0; left:0; right:0; z-index:20; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--card-border); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); max-width:600px; margin:0 auto; }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; color:var(--text-muted); background:none; border:none; cursor:pointer; }
  .nav-item.active{ color:var(--accent); }
  .nav-item span{ font-size:11px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='blog.html'" aria-label="목록으로">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button id="langToggle">한국어 / EN</button>
  </div>

  <span class="post-category">[카테고리]</span>
  <h1 class="post-title">[글 제목]</h1>
  <p class="post-meta">✍️ 말문 · [날짜]</p>

  <div class="post-thumb"><img src="images/blog-[번호]-hero.jpg" alt="[글 제목]"></div>

  <article class="post-body">
    <p>[본문 시작]</p>

    <div class="story-box">
      <div class="label">경험담</div>
      <p>[실제 경험/에피소드]</p>
    </div>

    <p>[본문 계속]</p>

    <div class="tip-box">
      <div class="tip-title">💡 팁</div>
      <p>[실전 팁]</p>
    </div>

    <p>[마무리]</p>
  </article>

  <div class="related-posts">
    <h3>같이 보면 좋은 글</h3>
    <div class="related-grid">
      <a href="blog-1.html">말문을 시작하며 — 정해진 교재 대신, 대화에서 시작하는 한국어</a>
    </div>
  </div>

  <div class="cta-box">
    <p>지금 무료 첫 수업을 예약해보세요</p>
    <a href="tutors.html">튜터 둘러보기</a>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='index.html'"><span>🏠</span><span>홈</span></button>
  <button class="nav-item" onclick="location.href='tutors.html'"><span>🔍</span><span>튜터</span></button>
  <button class="nav-item" onclick="location.href='curriculum.html'"><span>📖</span><span>커리큘럼</span></button>
  <button class="nav-item active" onclick="location.href='blog.html'"><span>💬</span><span>커뮤니티</span></button>
  <button class="nav-item" onclick="location.href='mypage.html'"><span>👤</span><span>마이페이지</span></button>
</nav>

<script>
document.getElementById('langToggle').addEventListener('click', () => {
  alert('이 글은 아직 영어 버전이 준비되지 않았습니다.');
});
</script>

</body>
</html>
