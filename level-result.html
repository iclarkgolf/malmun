<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레벨테스트 결과 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
    --accent-soft: rgba(224,153,58,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ padding:24px 0 8px; text-align:center; }
  .topbar p{ font-size:13px; color:var(--text-muted); margin:0; }

  .badge-wrap{ display:flex; flex-direction:column; align-items:center; padding:12px 0 24px; }
  .badge{
    width:112px; height:112px; border-radius:50%;
    background:var(--accent-soft); border:1px solid var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin-bottom:18px;
  }
  .badge .level{ font-size:24px; font-weight:600; color:#f0c98a; margin:0; }
  .badge .stage{ font-size:12px; color:#c2a06a; margin:2px 0 0; }
  .result-desc{ font-size:15px; text-align:center; line-height:1.6; margin:0; }

  .skill-block{ padding:8px 0 24px; }
  .skill-row{ display:flex; align-items:center; margin-bottom:12px; }
  .skill-name{ font-size:13px; color:var(--text-secondary); width:44px; flex-shrink:0; }
  .skill-track{ flex:1; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; margin:0 12px; overflow:hidden; }
  .skill-fill{ height:100%; background:var(--accent); border-radius:3px; }
  .skill-pct{ font-size:12px; color:var(--text-muted); width:36px; text-align:right; }

  .bottom{ padding:20px 0 32px; margin-top:auto; }
  .btn-primary{
    display:block; width:100%; text-align:center; padding:16px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text); margin-bottom:10px;
  }
  .btn-ghost{
    display:block; width:100%; text-align:center; padding:14px; border-radius:12px;
    font-size:13px; color:var(--text-muted); cursor:pointer; border:none; background:none;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar"><p>레벨테스트 완료</p></div>

  <div class="badge-wrap">
    <div class="badge">
      <p class="level">중급</p>
      <p class="stage">2단계</p>
    </div>
    <p class="result-desc">일상 대화는 가능하지만<br>문법 정확도가 아쉬운 단계예요</p>
  </div>

  <div class="skill-block">
    <div class="skill-row">
      <span class="skill-name">듣기</span>
      <div class="skill-track"><div class="skill-fill" style="width:75%"></div></div>
      <span class="skill-pct">75%</span>
    </div>
    <div class="skill-row">
      <span class="skill-name">읽기</span>
      <div class="skill-track"><div class="skill-fill" style="width:60%"></div></div>
      <span class="skill-pct">60%</span>
    </div>
    <div class="skill-row">
      <span class="skill-name">문법</span>
      <div class="skill-track"><div class="skill-fill" style="width:40%"></div></div>
      <span class="skill-pct">40%</span>
    </div>
  </div>

  <div class="bottom">
    <button class="btn-primary" onclick="location.href='tutors.html'">내 등급에 맞는 튜터 보기</button>
    <button class="btn-ghost" onclick="location.href='login.html'">결과 저장하고 나중에 보기</button>
  </div>
</div>

</body>
</html>
