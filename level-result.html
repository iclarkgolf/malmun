<script>
/* 2026-11-19 처음 온 방문자 언어 자동 선택: 주소에 lang도 없고 고른 언어도 없으면 휴대폰·PC 언어를 보고 정함 (한국어면 한국어, 일본어면 일본어, 그 밖은 영어). 검색엔진 봇은 그대로 둠 */
(function(){
  try{
    var p = new URLSearchParams(location.search);
    if(p.get('lang')) return;
    if(localStorage.getItem('malmun_lang')) return;
    if(/bot|crawl|spider|slurp|yeti|daum|bingpreview|facebookexternalhit|lighthouse|headless/i.test(navigator.userAgent)) return;
    var f = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
    var l = f.indexOf('ko') === 0 ? 'ko' : (f.indexOf('ja') === 0 ? 'ja' : 'en');
    localStorage.setItem('malmun_lang', l);
    if(l !== 'ko' && false){ p.set('lang', l); location.replace(location.pathname + '?' + p.toString() + location.hash); }
  }catch(e){}
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>레벨테스트 결과 | 말문</title>
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ padding:24px 0 8px; text-align:center; }
  .topbar p{ font-size:13px; color:var(--text-muted); margin:0; }

  .badge-wrap{ display:flex; flex-direction:column; align-items:center; padding:12px 0 24px; }
  .badge{
    width:112px; height:112px; border-radius:50%;
    background:var(--accent-soft); border:1px solid var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin-bottom:18px;
  }
  .badge .level{ font-size:24px; font-weight:600; color:var(--accent-text); margin:0; }
  .badge .stage{ font-size:12px; color:var(--accent); margin:2px 0 0; }
  .result-desc{ font-size:15px; text-align:center; line-height:1.6; margin:0; color:var(--text); }

  .skill-block{ padding:8px 0 24px; }
  .skill-row{ display:flex; align-items:center; margin-bottom:12px; }
  .skill-name{ font-size:13px; color:var(--text-secondary); width:44px; flex-shrink:0; }
  .skill-track{ flex:1; height:6px; background:var(--card-border); border-radius:3px; margin:0 12px; overflow:hidden; }
  .skill-fill{ height:100%; background:var(--accent); border-radius:3px; }
  .skill-pct{ font-size:12px; color:var(--text-muted); width:36px; text-align:right; }

  .bottom{ padding:20px 0 32px; margin-top:auto; }
  .btn-primary{
    display:block; width:100%; text-align:center; padding:16px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text); margin-bottom:10px;
  }
  .btn-ghost{
    display:block; width:100%; text-align:center; padding:14px; border-radius:12px;
    font-size:13px; color:var(--text-muted); cursor:pointer; border:none; background:none;
  }
</style>
</head>
<body>

  </div>

  <div class="skill-block">
    <div class="skill-row">

      <span class="skill-pct" id="skillPctGrammar">40%</span>

</div>

const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",

};

// 필리핀 통신망·카카오톡 등 인앱브라우저에서 Firestore 연결 실패 방지 (롱폴링 강제)
try{ db.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, merge: true }); }catch(e){ console.warn('firestore settings', e); }

const levelResult = {

  skills: RESULT_SKILLS,

};

async function saveHistoryEntry(uid, entry){
  await db.collection('users').doc(uid).collection('history').add({
    ...entry,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

auth.onAuthStateChanged(async (user) => {
  if(user){
    await saveHistoryEntry(user.uid, levelResult);
  } else {
    localStorage.setItem('malmun_pending_history', JSON.stringify(levelResult));
  }
});
</script>

    var go = c.querySelector('.go'); go.disabled = true;
    fetch(BASE + 'quickInquiries?key=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: {
      name: S(n.slice(0, 60)), contact: S(v.slice(0, 100)), contactType: S(ty), message: S(m.slice(0, 1000)), lang: S(l), page: S(page), tz: S(tz().slice(0, 60)),
      ref: S((document.referrer || '').slice(0, 200)), vid: S(vid || ''), status: S('new'), createdAt: { timestampValue: new Date().toISOString() } } }) })
    .then(function(r){
      if(!r.ok) throw new Error('save');
      try{ fetch(ALERT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({
        studentName: n, studentEmail: ty + ': ' + v, tutorName: 'PJ', dayLabel: '[30초 문의 · ' + (l === 'ja' ? '일본어' : '영어') + ' 화면] ' + (m || '내용 없음'), time: tz() + ' · ' + page,
        price: 0, isFreeOrientation: true, joinUrl: 'https://malmunkorean.com/admin.html' }) }); }catch(e){}
      try{ localStorage.setItem('mm_qi_done', '1'); }catch(e){}
      c.innerHTML = '<h4 style="margin:6px 0">' + t.ok + '</h4>';
      setTimeout(function(){ c.style.display = 'none'; }, 4000);
    }).catch(function(){ go.disabled = false; msg.textContent = t.err; });
  }
  function start(){
    document.body.appendChild(b); document.body.appendChild(c); draw();
    var week = 7 * 24 * 3600 * 1000;
    var auto = false; try{ auto = !sessionStorage.getItem('mm_qi_auto') && (Date.now() - closedAt > week); }catch(e){}
    if(auto){ setTimeout(function(){ if(L() && c.style.display !== 'block'){ try{ sessionStorage.setItem('mm_qi_auto', '1'); }catch(e){} open(); } }, 20000); }
    document.addEventListener('click', function(e){ if(e.target && e.target.closest && (e.target.closest('.lang-option') || e.target.closest('[data-l]'))){ setTimeout(function(){ if(c.style.display !== 'block') draw(); }, 50); } }, true);
  }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
