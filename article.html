/* 2026-11-19 처음 온 방문자 언어 자동 선택: 주소에 lang도 없고 고른 언어도 없으면 휴대폰·PC 언어를 보고 정함 (한국어면 한국어, 일본어면 일본어, 그 밖은 영어). 검색엔진 봇은 그대로 둠 */
(function(){

    var p = new URLSearchParams(location.search);

    if(/bot|crawl|spider|slurp|yeti|daum|bingpreview|facebookexternalhit|lighthouse|headless/i.test(navigator.userAgent)) return;

    localStorage.setItem('malmun_lang', l);
    if(l !== 'ko' && false){ p.set('lang', l); location.replace(location.pathname + '?' + p.toString() + location.hash); }
  }catch(e){}
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// 필리핀 통신망·카카오톡 등 인앱브라우저에서 Firestore 연결 실패 방지 (롱폴링 강제)
try{ db.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, merge: true }); }catch(e){ console.warn('firestore settings', e); }

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadArticle(){
  const id = new URLSearchParams(location.search).get('id');
  const content = document.getElementById('content');
  if(!id){ content.innerHTML = '<div class="error">글을 찾을 수 없습니다</div>'; return; }
  try{
    const doc = await db.collection('blogPosts').doc(id).get();
    if(!doc.exists || !doc.data().published){
      content.innerHTML = '<div class="error">글을 찾을 수 없습니다</div>';
      return;
    }
    const p = doc.data();
    document.title = p.title + ' | 말문 Malmun';
    // 검색엔진용: 글마다 설명·대표 주소(canonical)·공유 정보를 따로 넣음
    try{
      const desc = (p.excerpt || (p.body||'').replace(/\s+/g,' ')).trim().slice(0,155);
      const url = 'https://malmunkorean.com/article.html?id=' + id;
      const setM = (attr, key, val) => { let m = document.head.querySelector('meta['+attr+'="'+key+'"]'); if(!m){ m = document.createElement('meta'); m.setAttribute(attr, key); document.head.appendChild(m); } m.setAttribute('content', val); };
      setM('name','description', desc);
      setM('property','og:title', p.title); setM('property','og:description', desc); setM('property','og:url', url); setM('property','og:type','article');
      if(p.thumb) setM('property','og:image', p.thumb);
      let c = document.head.querySelector('link[rel="canonical"]'); if(!c){ c = document.createElement('link'); c.rel='canonical'; document.head.appendChild(c); } c.href = url;
      if(/[a-z]{3,}/i.test(p.title) && /^[\x00-\x7F]/.test((p.body||'').trim())) document.documentElement.lang = 'en';
    }catch(e){ console.warn('seo', e); }
    const dt = p.createdAt ? new Date(p.createdAt.seconds*1000).toLocaleDateString('ko-KR') : '';
    const paragraphs = (p.body||'').split(/\n\s*\n/).filter(x=>x.trim()).map(t => `<p>${esc(t).replace(/\n/g,'<br>')}</p>`).join('');

    content.innerHTML = `
      <span class="post-category">${esc(p.cat)}</span>
      <h1 class="post-title">${esc(p.title)}</h1>
      <p class="post-meta">✍️ 말문 · ${dt}</p>
      ${p.thumb ? `<div class="post-thumb"><img src="${p.thumb}" alt="${esc(p.title)}"></div>` : ''}
      <article class="post-body">${paragraphs}</article>
      ${rdSection(p)}
      <div class="cta-box">
        <p>지금 무료 첫 수업을 예약해보세요</p>
        <a href="tutors.html">튜터 둘러보기</a>
      </div>
    `;
    rdLoadWidget();
  }catch(e){
    console.error(e);
    content.innerHTML = '<div class="error">글을 불러오지 못했습니다</div>';
  }
}
// ───── Reddit 대화 (레딧 공식 퍼가기 카드) ─────
// 관리자 글쓰기 화면의 "Reddit 주소" 칸에 넣은 글·댓글 주소를 레딧 공식 카드로 보여 줌.
// 카드는 방문할 때마다 레딧에서 바로 불러오므로, 레딧에서 고치거나 지운 내용도 그대로 반영됨
function rdOk(u){ return /^https:\/\/(www\.)?reddit\.com\/r\/[A-Za-z0-9_]+\/comments\/[a-z0-9]+(\/[^\s"'<>]*)?$/i.test(u||''); }
function rdCard(u){ return `<blockquote class="reddit-embed-bq" data-embed-showtitle="false" data-embed-height="316"><a href="${esc(u)}">Reddit</a></blockquote><a class="rd-go" href="${esc(u)}" target="_blank" rel="noopener">↗ 레딧에서 열기</a>`; }
function rdSection(p){
  const post = rdOk(p.redditUrl) ? p.redditUrl : '';
  const coms = (Array.isArray(p.redditComments) ? p.redditComments : []).filter(rdOk).slice(0, 40);
  if(!post && !coms.length) return '';
  return `<section class="rd-box">
    <div class="rd-head"><span class="rd-logo">r/</span><b>Reddit에서 나눈 이야기</b></div>
    <p class="rd-sub">이 글은 Reddit에도 올렸어요. 전 세계 학습자들과 나눈 대화를 함께 보세요.</p>
    ${post ? rdCard(post) : ''}
    ${coms.map(rdCard).join('')}
    ${post ? `<a class="rd-more" href="${esc(post)}" target="_blank" rel="noopener">Reddit에서 대화에 참여하기 →</a>` : ''}
  </section>`;
}
function rdLoadWidget(){
  if(!document.querySelector('.rd-box blockquote.reddit-embed-bq')) return;
  const s = document.createElement('script');
  s.src = 'https://embed.reddit.com/widgets.js'; s.async = true; s.charset = 'UTF-8';
  document.body.appendChild(s);
}
loadArticle();
</script>

<script>
(function(){

  var isBot = /bot|crawl|spider|slurp|yeti|daum|bingpreview|facebookexternalhit|lighthouse|headless|pingdom|uptimerobot/i.test(navigator.userAgent);
  var isAdmin = false; try{ isAdmin = localStorage.getItem('malmun_admin') === '1'; }catch(e){}
  function siteLang(){ try{ return localStorage.getItem('malmun_lang') || new URLSearchParams(location.search).get('lang') || 'ko'; }catch(e){ return 'ko'; } }
  function tz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){ return ''; } }
  function S(v){ return { stringValue: String(v == null ? '' : v).slice(0, 1000) }; }
  var page = (location.pathname.replace(/^\//, '') || 'index.html').slice(0, 60);

  /* ── 방문 기록 ── */
  var vid = null, pages = [], t0 = Date.now();
  if(!isBot && !isAdmin){
    try{
      vid = sessionStorage.getItem('mm_vid');
      pages = JSON.parse(sessionStorage.getItem('mm_pages') || '[]');
      t0 = Number(sessionStorage.getItem('mm_t0')) || Date.now();
    }catch(e){}
    var fresh = !vid;
    if(fresh){
      vid = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      t0 = Date.now();
      try{ sessionStorage.setItem('mm_vid', vid); sessionStorage.setItem('mm_t0', String(t0)); }catch(e){}
    }
    if(pages[pages.length - 1] !== page && pages.length < 30) pages.push(page);
    try{ sessionStorage.setItem('mm_pages', JSON.stringify(pages)); }catch(e){}
    var secs = function(){ return Math.min(86400, Math.max(0, Math.round((Date.now() - t0) / 1000))); };
    var arr = function(){ return { arrayValue: { values: pages.map(function(x){ return S(x); }) } }; };
    if(fresh){
      var ref = ''; try{ var r = document.referrer ? new URL(document.referrer) : null; if(r && r.hostname !== location.hostname) ref = (r.hostname + r.pathname).slice(0, 200); }catch(e){}
      var q = new URLSearchParams(location.search);
      var day = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
      var now = new Date().toISOString();
      fetch(BASE + 'visits?documentId=' + vid + '&key=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: {
        day: S(day), lang: S((navigator.language || '').slice(0, 20)), siteLang: S(siteLang()), tz: S(tz().slice(0, 60)),
        ref: S(ref), src: S((q.get('utm_source') || q.get('ref') || '').slice(0, 60)), landing: S((page + location.search).slice(0, 200)),
        pages: arr(), secs: { integerValue: '0' }, mobile: { booleanValue: /Mobi|Android|iPhone/i.test(navigator.userAgent) },
        createdAt: { timestampValue: now }, lastAt: { timestampValue: now } } }) }).catch(function(){});
    }else{
      setTimeout(function(){ send(false); }, 800);
    }
    function send(beacon){
      var url = BASE + 'visits/' + vid + '?key=' + KEY + '&updateMask.fieldPaths=pages&updateMask.fieldPaths=secs&updateMask.fieldPaths=lastAt&updateMask.fieldPaths=siteLang&currentDocument.exists=true';
      try{ fetch(url, { method: 'PATCH', keepalive: !!beacon, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { pages: arr(), secs: { integerValue: String(secs()) }, lastAt: { timestampValue: new Date().toISOString() }, siteLang: S(siteLang()) } }) }).catch(function(){}); }catch(e){}
    }
    var lastSent = 0;
    function maybe(){ if(Date.now() - lastSent > 5000){ lastSent = Date.now(); send(true); } }
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') maybe(); });
    window.addEventListener('pagehide', maybe);
  }

  /* ── 30초 문의 (영어·일본어 화면에서만) ── */
  if(!SHOW_WIDGET || isBot) return;
  var T = {
    en: { bub: 'Free Korean chat?', h: 'Try a free Korean chat', p: 'Leave your name and how to reach you. PJ will message you within a day.', name: 'Your name', ct: 'How should we contact you?', c: 'Email or phone / ID', m: 'What do you want to learn? (optional)', send: 'Send', ok: 'Thank you! We will contact you soon.', need: 'Please write your name and contact.', err: 'Sorry, it did not send. Please try again.' },
    ja: { bub: '無料で韓国語トーク', h: '無料の韓国語トークを体験', p: 'お名前と連絡先を残してください。1日以内にPJからご連絡します。', name: 'お名前', ct: '連絡方法', c: 'メールまたは電話番号・ID', m: '学びたいこと（任意）', send: '送信', ok: 'ありがとうございます。すぐにご連絡します。', need: 'お名前と連絡先を入力してください。', err: '送信できませんでした。もう一度お試しください。' }
  };
  function L(){ var l = siteLang(); return T[l] ? l : null; }
  var done = false, closedAt = 0;
  try{ done = localStorage.getItem('mm_qi_done') === '1'; closedAt = Number(localStorage.getItem('mm_qi_closed')) || 0; }catch(e){}
  if(done) return;
  var css = document.createElement('style');
  css.textContent = '#mmqi-b{position:fixed;right:14px;bottom:84px;z-index:9990;background:#EF9F27;color:#412402;border:none;border-radius:999px;padding:11px 16px;font:600 14px/1 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}'
    + '@media(min-width:769px){#mmqi-b{bottom:22px}#mmqi-c{bottom:22px!important}}'
    + '#mmqi-c{position:fixed;right:12px;bottom:84px;z-index:9991;width:min(330px,calc(100vw - 24px));background:#fff;border:1px solid #E8E4D8;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:16px;font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#2C2C2A;display:none}'

    + '#mmqi-c input,#mmqi-c select,#mmqi-c textarea{width:100%;box-sizing:border-box;border:1px solid #E8E4D8;border-radius:10px;padding:10px;font-size:15px;margin:0 0 8px;font-family:inherit;background:#fff}'

    + '#mmqi-c .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:22px;color:#8A8880;cursor:pointer}#mmqi-c .msg{font-size:13px;margin-top:6px;color:#D85A30}';
  document.head.appendChild(css);

  function draw(){

    document.body.appendChild(b); document.body.appendChild(c); draw();
    var week = 7 * 24 * 3600 * 1000;
    var auto = false; try{ auto = !sessionStorage.getItem('mm_qi_auto') && (Date.now() - closedAt > week); }catch(e){}
    if(auto){ setTimeout(function(){ if(L() && c.style.display !== 'block'){ try{ sessionStorage.setItem('mm_qi_auto', '1'); }catch(e){} open(); } }, 20000); }
    document.addEventListener('click', function(e){ if(e.target && e.target.closest && (e.target.closest('.lang-option') || e.target.closest('[data-l]'))){ setTimeout(function(){ if(c.style.display !== 'block') draw(); }, 50); } }, true);
  }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
