<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외국인 전문직들이 한국을 선택하는 이유 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ padding:24px 0 16px; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }

  .hero-image{ margin:0 0 20px; height:160px; border-radius:14px; background:linear-gradient(135deg,#2a2f38,#1a1d24); }

  .tag{ font-size:11px; color:var(--accent); margin:0 0 8px; }
  .title{ font-size:18px; font-weight:600; line-height:1.4; margin:0 0 10px; }
  .meta{ font-size:12px; color:var(--text-muted); margin:0 0 20px; }

  .body-text{ flex:1; }
  .body-text p{ font-size:14px; color:var(--text-secondary); line-height:1.75; margin:0 0 16px; }

  .bottom{ padding:16px 0 32px; }
  .btn-primary{
    display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='blog.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="hero-image"></div>

  <p class="tag">한국 이주 이야기</p>
  <p class="title">외국인 전문직들이 한국을 선택하는 이유</p>
  <p class="meta">읽는 시간 4분</p>

  <div class="body-text">
    <p>최근 조사에 따르면 해외 26개국에서 한국에 대한 호감도는 매년 오르고 있습니다. 특히 경제적 성취와 문화적 매력이 동시에 작용하며, 전문직 종사자들의 이주 결정에도 영향을 주고 있습니다.</p>
    <p>언어는 그 시작점입니다. 실력 있는 튜터와의 1:1 대화는 단순 암기가 아니라, 실제 업무 환경에서 통하는 언어 감각을 길러줍니다.</p>
  </div>

  <div class="bottom">
    <button class="btn-primary" onclick="location.href='level-test.html'">내 한국어 레벨 확인하기</button>
  </div>
</div>

</body>
</html>
