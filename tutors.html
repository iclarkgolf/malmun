<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>튜터 목록 | 말문 Malmun</title>
<meta name="description" content="검증된 1:1 한국어 튜터를 목적별로 찾아보세요 — 돈벌이, 공부, 살아보기, 유행따라가기까지 나에게 맞는 튜터와 첫 수업(무료)을 시작할 수 있어요.">
<link rel="canonical" href="https://malmunkorean.com/tutors.html">
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
    --coral: #D85A30;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:0 20px 32px; }

  .header{ padding:24px 0 14px; display:flex; justify-content:space-between; align-items:flex-start; }
  .header p.sub{ font-size:12px; color:var(--text-muted); margin:0 0 4px; }
  .header p.philosophy{ font-size:12px; color:var(--text-muted); margin:4px 0 0; line-height:1.5; max-width:520px; }
  .header p.title{ font-size:17px; font-weight:600; margin:0; }
  .lang-dropdown{ position:relative; flex-shrink:0; }
  #langToggle{
    background:none; border:1px solid var(--card-border); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px; flex-shrink:0;
  }
  #langToggle .cur{ color:var(--text); }
  #langToggle .caret{ font-size:10px; color:var(--text-muted); }
  .lang-menu{
    position:absolute; top:38px; right:0; z-index:30;
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    box-shadow:0 8px 24px rgba(44,44,42,0.12); min-width:120px; padding:6px;
    display:none;
  }
  .lang-menu.open{ display:block; }
  .lang-menu .lang-option{
    display:block; padding:8px 10px; border-radius:8px;
    font-size:13px; color:var(--text); font-weight:500; cursor:pointer;
  }
  .lang-menu .lang-option:hover{ background:var(--accent-soft); }
  .lang-menu .lang-option.active{ color:var(--accent-text); background:var(--accent-soft); }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding:0 0 18px; margin:0 -20px; padding-left:20px; padding-right:20px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; font-size:12px; padding:8px 14px; border-radius:16px; white-space:nowrap;
    border:1px solid var(--card-border); color:var(--text-secondary); cursor:pointer; background:none;
  }
  .chip.active{ background:var(--accent); color:var(--accent-text); border:none; font-weight:600; }

  .tutor-list{ display:flex; flex-direction:column; gap:12px; }
  .tutor-card{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px;
    cursor:pointer; width:100%; text-align:left; color:var(--text);
  }
  .avatar{ width:52px; height:52px; border-radius:50%; flex-shrink:0; }
  .info{ flex:1; }
  .info-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .name{ font-size:14px; font-weight:600; margin:0; }
  .price{ font-size:13px; color:var(--coral); font-weight:600; margin:0; white-space:nowrap; }
  .desc{ font-size:12px; color:var(--text-muted); margin:4px 0 6px; }
  .meta{ font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:4px; }
  .meta .star{ color:var(--accent); }
  .empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:40px 0; }

  body{ padding-bottom:76px; }
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--card-border);
    display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 0; color:var(--text-muted); background:none; border:none; cursor:pointer;
  }
  .nav-item.active{ color:var(--accent); }
  .nav-item span{ font-size:11px; }

  @media (min-width:900px){
    .wrap{ max-width:1080px; }
    .tutor-list{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 340px)); gap:16px; justify-content:center; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <p class="title" id="tutorCountTitle" data-i18n="tutors.count">튜터를 불러오는 중...</p>
      <p class="philosophy" data-i18n="tutors.philosophy">여러 튜터를 늘어놓지 않아요. 직접 만나보고 확신이 선 사람만 소개해요.</p>
    </div>
    <div class="lang-dropdown" id="langDropdown">
      <button id="langToggle" aria-label="언어 전환" onclick="toggleLangMenu(event)">
        <span class="cur" id="langCur">한국어</span> <span class="caret">▾</span>
      </button>
      <div class="lang-menu" id="langMenu">
        <div class="lang-option" data-lang="ko" onclick="setLang(event,'ko')">한국어</div>
        <div class="lang-option" data-lang="en" onclick="setLang(event,'en')">English</div>
        <div class="lang-option" data-lang="ja" onclick="setLang(event,'ja')">日本語</div>
      </div>
    </div>
    <a href="tutor-admin.html" style="width:32px; height:32px; border-radius:50%; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:14px; margin-left:8px;" aria-label="튜터 관리">⚙️</a>
  </div>

  <div class="chips">
    <button class="chip active" data-filter="all" data-i18n="tutors.f.all">전체</button>
    <button class="chip" data-filter="rating" data-i18n="tutors.f.rating">평점순</button>
    <button class="chip" data-filter="exam" data-i18n="tutors.f.exam">시험 대비</button>
    <button class="chip" data-filter="biz" data-i18n="tutors.f.biz">비즈니스</button>
  </div>

  <div class="tutor-list" id="tutorList">
    <p class="empty">불러오는 중...</p>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='index.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span data-i18n="nav.home">홈</span>
  </button>
  <button class="nav-item active" onclick="location.href='tutors.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span data-i18n="nav.tutors">튜터</span>
  </button>
  <button class="nav-item" onclick="location.href='curriculum.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    <span data-i18n="nav.curriculum">커리큘럼</span>
  </button>
  <button class="nav-item" onclick="location.href='blog.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span data-i18n="nav.community">커뮤니티</span>
  </button>
  <button class="nav-item" onclick="location.href='mypage.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span data-i18n="nav.mypage">마이페이지</span>
  </button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentLang = localStorage.getItem('malmun_lang') || 'ko';
let tutorDocs = []; // { id, data }

const TRANSLATIONS = {
  ko: {
    "tutors.philosophy": "여러 튜터를 늘어놓지 않아요. 직접 만나보고 확신이 선 사람만 소개해요.",
    "tutors.f.all": "전체", "tutors.f.rating": "평점순", "tutors.f.exam": "시험 대비", "tutors.f.biz": "비즈니스",
    "unit.perLesson": "/회",
    "tutors.empty": "아직 등록된 튜터가 없어요. 곧 만나요!",
    "nav.home": "홈", "nav.tutors": "튜터", "nav.curriculum": "커리큘럼",
    "nav.community": "커뮤니티", "nav.mypage": "마이페이지"
  },
  en: {
    "tutors.philosophy": "We don't list every tutor we can find. We meet each one in person and only introduce the ones we trust.",
    "tutors.f.all": "All", "tutors.f.rating": "Top rated", "tutors.f.exam": "Exam prep", "tutors.f.biz": "Business",
    "unit.perLesson": "/lesson",
    "tutors.empty": "No tutors yet — check back soon!",
    "nav.home": "Home", "nav.tutors": "Tutors", "nav.curriculum": "Curriculum",
    "nav.community": "Community", "nav.mypage": "My page"
  },
  ja: {
    "tutors.philosophy": "たくさんの講師を並べません。直接お会いして、信頼できると確信した方だけをご紹介します。",
    "tutors.f.all": "すべて", "tutors.f.rating": "評価順", "tutors.f.exam": "試験対策", "tutors.f.biz": "ビジネス",
    "unit.perLesson": "／回",
    "tutors.empty": "まだ登録された講師がいません。近日公開！",
    "nav.home": "ホーム", "nav.tutors": "講師", "nav.curriculum": "カリキュラム",
    "nav.community": "コミュニティ", "nav.mypage": "マイページ"
  }
};

function t(key){
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.ko;
  return dict[key] !== undefined ? dict[key] : key;
}

function fmtKRW(n){ return '₩' + Number(n || 0).toLocaleString('en-US'); }

function renderTutorList(){
  const listEl = document.getElementById('tutorList');
  const countEl = document.getElementById('tutorCountTitle');

  if(tutorDocs.length === 0){
    listEl.innerHTML = `<p class="empty">${t('tutors.empty')}</p>`;
    const emptyTitle = { ko: '튜터 목록', en: 'Tutors', ja: '講師一覧' };
    countEl.textContent = emptyTitle[currentLang] || emptyTitle.ko;
    return;
  }

  const langCountText = {
    ko: `튜터 ${tutorDocs.length}명이 함께하고 있어요`,
    en: `${tutorDocs.length} tutors ready to help`,
    ja: `${tutorDocs.length}人の講師が在籍しています`
  };
  countEl.textContent = langCountText[currentLang] || langCountText.ko;

  listEl.innerHTML = '';
  tutorDocs.forEach(({ id, data }) => {
    const ko = data.ko || {};
    const localized = data[currentLang] || {};
    const d = {
      name: localized.name || ko.name,
      role: localized.role || ko.role,
      rating: ko.rating,
      reviewCount: ko.reviewCount
    };
    const reviewText = {
      ko: `후기 ${d.reviewCount || 0}개`,
      en: `${d.reviewCount || 0} reviews`,
      ja: `レビュー${d.reviewCount || 0}件`
    };
    const card = document.createElement('button');
    card.className = 'tutor-card';
    card.onclick = () => location.href = 'tutor-profile.html?id=' + id;
    card.innerHTML = `
      <div class="avatar" style="${data.avatarImage ? `background:url('${data.avatarImage}') center/cover;` : `background:${data.avatarColor || '#3b5f8f'};`}"></div>
      <div class="info">
        <div class="info-top"><p class="name">${d.name}</p><p class="price">${fmtKRW(data.price)}${t('unit.perLesson')}</p></div>
        <p class="desc">${d.role || ''}</p>
        <div class="meta"><span class="star">★</span> ${d.rating || '5.0'} · ${reviewText[currentLang] || reviewText.ko}</div>
      </div>
    `;
    listEl.appendChild(card);
  });
}

async function loadTutors(){
  try{
    const snap = await db.collection('tutors').orderBy('order', 'asc').get();
    tutorDocs = snap.docs.map(doc => ({ id: doc.id, data: doc.data() }));
  }catch(err){
    console.error('튜터 목록 로드 실패:', err);
    tutorDocs = [];
  }
  renderTutorList();
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  const LANG_LABELS = { ko: '한국어', en: 'English', ja: '日本語' };
  document.getElementById('langCur').textContent = LANG_LABELS[lang] || LANG_LABELS.ko;
  document.querySelectorAll('.lang-menu .lang-option').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-lang') === lang);
  });
  localStorage.setItem('malmun_lang', lang);
  renderTutorList();
}

function toggleLangMenu(e){
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
}
function setLang(e, lang){
  e.stopPropagation();
  applyLang(lang);
  document.getElementById('langMenu').classList.remove('open');
}
document.addEventListener('click', () => {
  const menu = document.getElementById('langMenu');
  if(menu) menu.classList.remove('open');
});

(function initLang(){
  const saved = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(saved);
})();

const chips = document.querySelectorAll('.chip');
chips.forEach(chip => {
  chip.addEventListener('click', () => {
    chips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    // 실제 서비스에서는 chip.dataset.filter 값으로 튜터 목록을 재정렬/필터링
  });
});

loadTutors();
</script>

</body>
</html>
