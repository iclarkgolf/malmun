<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>튜터 목록 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:0 20px 32px; }

  .header{ padding:24px 0 14px; }
  .header p.sub{ font-size:12px; color:var(--text-muted); margin:0 0 4px; }
  .header p.title{ font-size:17px; font-weight:600; margin:0; }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding:0 0 18px; margin:0 -20px; padding-left:20px; padding-right:20px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; font-size:12px; padding:8px 14px; border-radius:16px; white-space:nowrap;
    border:0.5px solid rgba(255,255,255,0.15); color:var(--text-secondary); cursor:pointer; background:none;
  }
  .chip.active{ background:var(--accent); color:var(--accent-text); border:none; font-weight:600; }

  .tutor-list{ display:flex; flex-direction:column; gap:12px; }
  .tutor-card{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--card); border-radius:14px; padding:14px;
    cursor:pointer; border:none; width:100%; text-align:left; color:var(--text);
  }
  .avatar{ width:52px; height:52px; border-radius:50%; flex-shrink:0; }
  .info{ flex:1; }
  .info-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .name{ font-size:14px; font-weight:600; margin:0; }
  .price{ font-size:13px; color:var(--accent); margin:0; }
  .desc{ font-size:12px; color:var(--text-muted); margin:4px 0 6px; }
  .meta{ font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:4px; }
  .meta .star{ color:var(--accent); }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <p class="sub">내 등급: 중급 2단계</p>
    <p class="title">튜터 24명이 매칭됐어요</p>
  </div>

  <div class="chips">
    <button class="chip active" data-filter="all">전체</button>
    <button class="chip" data-filter="rating">평점순</button>
    <button class="chip" data-filter="exam">시험 대비</button>
    <button class="chip" data-filter="biz">비즈니스</button>
  </div>

  <div class="tutor-list">
    <button class="tutor-card" onclick="location.href='tutor-profile.html?id=jieun'">
      <div class="avatar" style="background:#3b5f8f;"></div>
      <div class="info">
        <div class="info-top"><p class="name">지은</p><p class="price">₩28,000/회</p></div>
        <p class="desc">전 항공사 승무원 · 비즈니스 한국어</p>
        <div class="meta"><span class="star">★</span> 4.9 · 후기 132개</div>
      </div>
    </button>

    <button class="tutor-card" onclick="location.href='tutor-profile.html?id=hyunwoo'">
      <div class="avatar" style="background:#6a4f8f;"></div>
      <div class="info">
        <div class="info-top"><p class="name">현우</p><p class="price">₩24,000/회</p></div>
        <p class="desc">前 한국어교원 · TOPIK 전문</p>
        <div class="meta"><span class="star">★</span> 5.0 · 후기 89개</div>
      </div>
    </button>

    <button class="tutor-card" onclick="location.href='tutor-profile.html?id=soojin'">
      <div class="avatar" style="background:#8f4f5f;"></div>
      <div class="info">
        <div class="info-top"><p class="name">수진</p><p class="price">₩22,000/회</p></div>
        <p class="desc">대학원생 · 일상 회화 전문</p>
        <div class="meta"><span class="star">★</span> 4.8 · 후기 61개</div>
      </div>
    </button>
  </div>
</div>

<script>
  const chips = document.querySelectorAll('.chip');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      // 실제 서비스에서는 chip.dataset.filter 값으로 튜터 목록을 재정렬/필터링
    });
  });
</script>

</body>
</html>
