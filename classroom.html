<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화상수업 | 말문</title>
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--card-border); background:#fff;
  }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  .topbar .info{ text-align:center; }
  .topbar .info .name{ font-size:14px; font-weight:600; margin:0; }
  .topbar .info .time{ font-size:12px; color:var(--text-muted); margin:2px 0 0; }
  .topbar .spacer{ width:18px; }

  #meet{ width:100%; height:calc(100vh - 60px); background:#111; }

  .error-box{
    max-width:420px; margin:60px auto; text-align:center; padding:0 24px;
  }
  .error-box p{ font-size:14px; color:var(--text-secondary); line-height:1.6; }
  .error-box a{ display:inline-block; margin-top:16px; background:var(--accent); color:var(--accent-text); padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; }

  .loading{ text-align:center; color:var(--text-muted); font-size:13px; padding:100px 0; }
</style>
</head>
<body>
<script src="inapp-browser-guard.js"></script>

<div class="topbar">
  <button onclick="location.href='mypage.html'" aria-label="뒤로가기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <div class="info">
    <p class="name" id="topTutorName">화상수업</p>
    <p class="time" id="topTime"></p>
  </div>
  <div class="spacer"></div>
</div>

<div id="content">
  <p class="loading">불러오는 중...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const urlParams = new URLSearchParams(window.location.search);
const roomParam = urlParams.get('room');
const tutorParam = urlParams.get('tutor') || '';
const timeParam = urlParams.get('time') || '';

document.getElementById('topTutorName').textContent = tutorParam ? `${tutorParam} 튜터와 수업` : '화상수업';
document.getElementById('topTime').textContent = timeParam;

function showError(msg){
  document.getElementById('content').innerHTML = `
    <div class="error-box">
      <p>${msg}</p>
      <a href="mypage.html">마이페이지로 돌아가기</a>
    </div>
  `;
}

function loadJitsiScript(cb){
  const s = document.createElement('script');
  s.src = 'https://8x8.vc/libs/external_api.min.js';
  s.onload = cb;
  s.onerror = () => showError('화상통화 모듈을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해주세요.');
  document.body.appendChild(s);
}

function enterRoom(displayName){
  if(!roomParam){
    showError('이 링크에는 수업방 정보가 없어요. 마이페이지의 "다음 수업" 카드를 통해 들어와주세요.');
    return;
  }
  document.getElementById('content').innerHTML = `<div id="meet"></div>`;
  loadJitsiScript(() => {
    const domain = '8x8.vc';
    const options = {
      roomName: `vpaas-magic-cookie-cf396ecd65dc43128daa258dfe07cba4/malmun-lesson-${roomParam}`,
      width: '100%',
      height: window.innerHeight - 60,
      parentNode: document.querySelector('#meet'),
      userInfo: { displayName: displayName },
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: true
      },
      interfaceConfigOverwrite: {
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false
      }
    };
    new JitsiMeetExternalAPI(domain, options);
  });
}

auth.onAuthStateChanged((user) => {
  if(!user){
    location.href = 'login.html?next=mypage';
    return;
  }
  const displayName = user.displayName || (user.email ? user.email.split('@')[0] : '학생');
  enterRoom(displayName);
});
</script>

</body>
</html>
