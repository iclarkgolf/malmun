<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말문 Malmun</title>
<style>
  :root{
    --bg:#FFF9F0; --card:#FFFFFF; --card-border:#E8E4D8;
    --text:#2C2C2A; --text-secondary:#5F5E5A; --text-muted:#8A8880;
    --accent:#EF9F27; --accent-text:#412402; --accent-soft:#FFF3E0; --coral:#D85A30;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:76px; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:600px; margin:0 auto; padding:0 20px 32px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 0; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  .lang-dropdown{ position:relative; }
  #langToggle{ background:none; border:1px solid var(--card-border); color:var(--text-secondary); border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; }
  #langToggle .caret{ font-size:10px; color:var(--text-muted); }
  .lang-menu{ position:absolute; top:38px; right:0; z-index:30; background:var(--card); border:1px solid var(--card-border); border-radius:14px; box-shadow:0 8px 24px rgba(44,44,42,0.12); min-width:120px; padding:6px; display:none; }
  .lang-menu.open{ display:block; }
  .lang-menu .lang-option{ display:block; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--text); font-weight:500; cursor:pointer; }
  .lang-menu .lang-option:hover{ background:var(--accent-soft); }
  .lang-menu .lang-option.active{ color:var(--accent-text); background:var(--accent-soft); }

  .eyebrow{ font-size:12px; font-weight:700; color:var(--coral); margin:0 0 10px; }
  .headline{ font-size:24px; font-weight:700; line-height:1.4; margin:0 0 26px; }

  .empathy-card{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:18px 20px; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start; }
  .empathy-card .mark{ font-size:18px; }
  .empathy-card p{ margin:0; font-size:14px; line-height:1.6; color:var(--text); }

  .sec-title{ font-size:15px; font-weight:700; margin:32px 0 12px; }
  .topics{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px 18px 14px; }
  .topics ul{ margin:0; padding-left:18px; }
  .topics li{ font-size:13px; color:var(--text-secondary); line-height:1.85; }

  .tutor-preview{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .tutor-mini{ flex-shrink:0; width:130px; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px; text-align:center; cursor:pointer; }
  .tutor-mini .av{ width:52px; height:52px; border-radius:50%; margin:0 auto 8px; background:#3b5f8f; background-size:cover; background-position:center; }
  .tutor-mini .n{ font-size:12px; font-weight:700; margin:0 0 2px; }
  .tutor-mini .r{ font-size:11px; color:var(--text-muted); }

  .cta{ display:block; text-align:center; background:var(--accent); color:var(--accent-text); font-weight:700; font-size:15px; padding:16px; border-radius:12px; margin-top:32px; border:none; width:100%; cursor:pointer; }
  .cta-sub{ display:block; text-align:center; font-size:12px; color:var(--text-muted); margin-top:10px; }

  .bottom-nav{ position:fixed; bottom:0; left:0; right:0; z-index:20; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--card-border); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); max-width:600px; margin:0 auto; }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; color:var(--text-muted); background:none; border:none; cursor:pointer; }
  .nav-item.active{ color:var(--accent); }
  .nav-item span{ font-size:11px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='index.html'" aria-label="홈으로">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="lang-dropdown" id="langDropdown">
      <button id="langToggle" aria-label="언어 전환" onclick="toggleLangMenu(event)">
        <span class="cur" id="langCur">한국어</span> <span class="caret">▾</span>
      </button>
      <div class="lang-menu" id="langMenu">
        <div class="lang-option" data-lang="ko" onclick="setLang(event,'ko')">한국어</div>
        <div class="lang-option" data-lang="en" onclick="setLang(event,'en')">English</div>
        <div class="lang-option" data-lang="ja" onclick="setLang(event,'ja')">日本語</div>
      </div>
    </div>
  </div>

  <div id="content"></div>

  <p class="sec-title" data-i18n="p.tutorTitle">먼저 만나볼 튜터</p>
  <div class="tutor-preview" id="tutorPreview"></div>

  <button class="cta" onclick="goNext()" id="ctaBtn">무료 레벨테스트 시작</button>
  <span class="cta-sub" data-i18n="p.ctaSub">1분이면 끝나요. 결과 보고 나서 결정해도 늦지 않아요.</span>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="location.href='index.html'"><span>🏠</span><span id="navHome">홈</span></button>
  <button class="nav-item" onclick="location.href='tutors.html'"><span>🔍</span><span id="navTutors">튜터</span></button>
  <button class="nav-item" onclick="location.href='curriculum.html'"><span>📖</span><span id="navCurriculum">커리큘럼</span></button>
  <button class="nav-item" onclick="location.href='blog.html'"><span>💬</span><span id="navCommunity">커뮤니티</span></button>
  <button class="nav-item" onclick="location.href='mypage.html'"><span>👤</span><span id="navMypage">마이페이지</span></button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

      topics:["편의점·마트에서 쓰는 말","병원·약국 이용하기","집 구하고 계약하기","은행·통신사 업무 보기","이웃과 인사 나누기","배달앱 주문하기"] },

      empathy:["좋아하는 아이돌 브이앱을 자막 없이 보고 싶었던 적 있나요?","팬 커뮤니티에서 한국 팬들과 진짜 대화하고 싶었던 순간, 있으시죠?"],

    en:{ eyebrow:"Following the trend", headline:"Want to understand that scene, that line, without subtitles?",
      empathy:["Wished you could watch your favorite idol's V Live without subtitles?","Wanted to really talk with Korean fans in the community?"],

function getType(){
  const t = new URLSearchParams(location.search).get('type');
  return CONTENT[t] ? t : 'biz';
}
let currentType = getType();

function render(){
  const lang = localStorage.getItem('malmun_lang') || 'ko';
  const c = CONTENT[currentType][lang] || CONTENT[currentType].ko;
  const icon = CONTENT[currentType].icon;
  const UI = {
    ko: { learnTitle: '이런 걸 배우게 돼요', ctaBtn: '무료 레벨테스트 시작', ctaSub: '1분이면 끝나요. 결과 보고 나서 결정해도 늦지 않아요.', tutorTitle: '먼저 만나볼 튜터', navHome: '홈', navTutors: '튜터', navCurriculum: '커리큘럼', navCommunity: '커뮤니티', navMypage: '마이페이지' },
    en: { learnTitle: "What you'll learn", ctaBtn: 'Start free level test', ctaSub: 'Takes about a minute — decide after you see your result.', tutorTitle: 'Meet a tutor first', navHome: 'Home', navTutors: 'Tutors', navCurriculum: 'Curriculum', navCommunity: 'Community', navMypage: 'My page' },
    ja: { learnTitle: 'こんなことを学びます', ctaBtn: '無料レベルテストを始める', ctaSub: '1分で終わります。結果を見てから決めても遅くありません。', tutorTitle: '先に講師を見てみる', navHome: 'ホーム', navTutors: '講師', navCurriculum: 'カリキュラム', navCommunity: 'コミュニティ', navMypage: 'マイページ' }
  };
  const u = UI[lang] || UI.ko;
  document.getElementById('content').innerHTML = `
    <p class="eyebrow">${icon} ${c.eyebrow}</p>
    <h1 class="headline">${c.headline}</h1>
    ${c.empathy.map(e => `<div class="empathy-card"><span class="mark">💬</span><p>${e}</p></div>`).join('')}
    <p class="sec-title">${u.learnTitle}</p>
    <div class="topics"><ul>${c.topics.map(t => `<li>${t}</li>`).join('')}</ul></div>
  `;
  document.getElementById('ctaBtn').textContent = u.ctaBtn;
  const LANG_LABELS = { ko: '한국어', en: 'English', ja: '日本語' };
  document.getElementById('langCur').textContent = LANG_LABELS[lang] || LANG_LABELS.ko;
  document.querySelectorAll('.lang-menu .lang-option').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-lang') === lang);
  });
  document.querySelector('[data-i18n="p.tutorTitle"]').textContent = u.tutorTitle;
  document.querySelector('[data-i18n="p.ctaSub"]').textContent = u.ctaSub;
  document.getElementById('navHome').textContent = u.navHome;
  document.getElementById('navTutors').textContent = u.navTutors;
  document.getElementById('navCurriculum').textContent = u.navCurriculum;
  document.getElementById('navCommunity').textContent = u.navCommunity;
  document.getElementById('navMypage').textContent = u.navMypage;
}

function toggleLangMenu(e){
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
}
function setLang(e, lang){
  e.stopPropagation();
  localStorage.setItem('malmun_lang', lang);
  document.getElementById('langMenu').classList.remove('open');
  render();
  loadTutorPreview();
}
document.addEventListener('click', () => {
  const menu = document.getElementById('langMenu');
  if(menu) menu.classList.remove('open');
});

function goNext(){
  localStorage.setItem('malmun_purpose', 'hero.purpose.' + currentType);
  location.href = 'level-test.html?purpose=' + currentType;
}

async function loadTutorPreview(){
  const wrap = document.getElementById('tutorPreview');
  try{
    const snap = await db.collection('tutors').orderBy('order','asc').limit(3).get();
    if(snap.empty){ wrap.innerHTML = ''; return; }
    const lang = localStorage.getItem('malmun_lang') || 'ko';
    wrap.innerHTML = snap.docs.map(doc => {
      const data = doc.data();
      const ko = data.ko || {};
      const localized = data[lang] || {};
      const name = localized.name || ko.name;
      const bg = data.avatarImage ? `background-image:url('${data.avatarImage}')` : `background:${data.avatarColor||'#3b5f8f'}`;
      return `
        <div class="tutor-mini" onclick="location.href='tutor-profile.html?id=${doc.id}'">
          <div class="av" style="${bg}"></div>
          <p class="n">${name||''}</p>
          <p class="r">★ ${ko.rating||'5.0'}</p>
        </div>`;
    }).join('');
  }catch(e){
    console.error(e);
    wrap.innerHTML = '';
  }
}

render();
loadTutorPreview();
</script>
