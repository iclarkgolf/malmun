<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지은 튜터 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
    --accent-soft: rgba(224,153,58,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
    padding-bottom:88px; /* sticky bar 공간 확보 */
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; }

  .back{ padding:24px 0 16px; }
  .back button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }

  .profile-head{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 0 20px; }
  .avatar-lg{ width:76px; height:76px; border-radius:50%; background:#3b5f8f; margin-bottom:14px; }
  .profile-head .name{ font-size:18px; font-weight:600; margin:0 0 4px; }
  .profile-head .role{ font-size:13px; color:var(--text-muted); margin:0 0 10px; }
  .profile-head .meta{ font-size:13px; color:#e5e4dd; display:flex; align-items:center; gap:6px; }
  .profile-head .meta .star{ color:var(--accent); }
  .profile-head .meta .dim{ font-size:12px; color:var(--text-muted); }

  .section{ padding:0 0 20px; }
  .section p.intro{ font-size:13px; color:var(--text-secondary); line-height:1.6; margin:0; }

  .tags{ display:flex; gap:8px; flex-wrap:wrap; padding:0 0 20px; }
  .tag{ font-size:12px; padding:6px 12px; border-radius:16px; background:rgba(255,255,255,0.06); color:var(--text-secondary); }
  .tag.highlight{ background:var(--accent-soft); color:#f0c98a; }

  .review-card{ background:var(--card); border-radius:12px; padding:14px; margin-bottom:20px; }
  .review-card .author{ font-size:12px; color:var(--text-muted); margin:0 0 6px; }
  .review-card .body{ font-size:13px; color:#e5e4dd; line-height:1.5; margin:0; }

  .booking-bar{
    position:fixed; bottom:0; left:0; right:0;
    background:#14161b; border-top:0.5px solid var(--card-border);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:12px;
  }
  .booking-bar .price{ font-size:16px; font-weight:600; white-space:nowrap; }
  .booking-bar .price .unit{ font-size:12px; color:var(--text-muted); font-weight:400; }
  .booking-bar button{
    flex:1; background:var(--accent); color:var(--accent-text);
    border:none; border-radius:12px; padding:14px; font-size:14px; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="back">
    <button onclick="location.href='tutors.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </div>

  <div class="profile-head">
    <div class="avatar-lg"></div>
    <p class="name">지은</p>
    <p class="role">전 항공사 승무원 · 비즈니스 한국어 전문</p>
    <div class="meta"><span class="star">★</span> 4.9 <span class="dim">· 후기 132개 · 수업 840회</span></div>
  </div>

  <div class="section">
    <p class="intro">10년간 승무원으로 일하며 40개국 승객을 응대했습니다. 비즈니스 미팅, 이메일, 전화 응대 상황극 위주로 수업합니다.</p>
  </div>

  <div class="tags">
    <span class="tag highlight">비즈니스 회화</span>
    <span class="tag">중급~고급</span>
    <span class="tag">영어 가능</span>
  </div>

  <div class="review-card">
    <p class="author">M.T. · 홍콩</p>
    <p class="body">비즈니스 미팅 준비할 때마다 도움 많이 받았어요. 실제 상황처럼 연습시켜주셔서 좋았습니다.</p>
  </div>
</div>

<div class="booking-bar">
  <span class="price">₩28,000<span class="unit">/회</span></span>
  <button onclick="location.href='booking.html?tutor=jieun'">수업 예약하기</button>
</div>

</body>
</html>
