<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>튜터 프로필 | 말문</title>
<meta name="description" content="말문 튜터 프로필 — 경력, 수업 방식, 가능한 시간을 확인하고 1:1 한국어 수업을 예약하세요.">
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
    padding-bottom:88px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; }

  .back{ padding:24px 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .back button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  #langToggle{
    background:none; border:1px solid var(--card-border); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }

  .profile-head{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 0 20px; }
  .avatar-lg{ width:76px; height:76px; border-radius:50%; background:#3b5f8f; margin-bottom:14px; }
  .profile-head .name{ font-size:18px; font-weight:600; margin:0 0 4px; }
  .profile-head .role{ font-size:13px; color:var(--text-muted); margin:0 0 10px; }
  .profile-head .meta{ font-size:13px; color:var(--text); display:flex; align-items:center; gap:6px; }
  .profile-head .meta .star{ color:var(--accent); }
  .profile-head .meta .dim{ font-size:12px; color:var(--text-muted); }

  .section{ padding:0 0 20px; }
  .section p.intro{ font-size:13px; color:var(--text-secondary); line-height:1.6; margin:0; }

  .tags{ display:flex; gap:8px; flex-wrap:wrap; padding:0 0 20px; }
  .tag{ font-size:12px; padding:6px 12px; border-radius:16px; background:var(--card); border:1px solid var(--card-border); color:var(--text-secondary); }
  .tag.highlight{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text); }

  .review-card{ background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:14px; margin-bottom:20px; }
  .review-card .author{ font-size:12px; color:var(--text-muted); margin:0 0 6px; }
  .review-card .body{ font-size:13px; color:var(--text); line-height:1.5; margin:0; }

  .booking-bar{
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid var(--card-border);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:12px;
  }
  .booking-bar .price{ font-size:16px; font-weight:600; white-space:nowrap; color:var(--text); }
  .booking-bar .price .unit{ font-size:12px; color:var(--text-muted); font-weight:400; }
  .booking-bar button{
    flex:1; background:var(--accent); color:var(--accent-text);
    border:none; border-radius:12px; padding:14px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .loading{ text-align:center; color:var(--text-muted); font-size:13px; padding:60px 0; }

  .instant-box{
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px;
    padding:14px; margin:0 0 20px; text-align:center;
  }
  .instant-box p{ font-size:12.5px; color:var(--accent-text); margin:0 0 10px; line-height:1.5; }
  .instant-box button{
    background:#fff; border:1px solid var(--accent); color:var(--accent-text);
    border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .instant-box button:disabled{ opacity:0.6; cursor:default; }

  /* 2026-11-07: 튜터 자기소개 확장 — 한줄 제목·나의 이야기·일상 사진·온라인 링크 (한/영/일) */
  .headline{ font-size:17px; font-weight:700; line-height:1.5; text-align:center; margin:0 0 18px; color:var(--text); }
  .sec-title{ font-size:14px; font-weight:700; margin:0 0 10px; color:var(--text); }
  .story{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px 16px 6px; margin:0 0 20px; }
  .story p{ font-size:14px; color:var(--text-secondary); line-height:1.8; margin:0 0 12px; word-break:keep-all; }
  .story.collapsed{ max-height:330px; overflow:hidden; position:relative; }
  .story.collapsed::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:80px; background:linear-gradient(rgba(255,255,255,0), #fff); }
  .more-btn{ display:block; width:100%; margin:-10px 0 20px; background:none; border:1px solid var(--card-border); border-radius:10px; padding:10px; font-size:13px; font-weight:600; color:var(--text); cursor:pointer; font-family:inherit; }
  .gallery{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 20px; }
  .gallery figure{ margin:0; background:var(--card); border:1px solid var(--card-border); border-radius:12px; overflow:hidden; }
  .gallery img{ width:100%; aspect-ratio:3/4; object-fit:cover; display:block; cursor:zoom-in; }
  .gallery figcaption{ font-size:12px; color:var(--text-secondary); line-height:1.55; padding:8px 10px 10px; }
  .gallery figcaption b{ display:block; color:var(--text); font-size:12.5px; margin-bottom:2px; }
  .links{ display:flex; flex-direction:column; gap:8px; margin:0 0 20px; }
  .links a{ display:block; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--text); font-weight:600; }
  .links a small{ display:block; font-weight:400; color:var(--text-muted); margin-top:2px; font-size:12px; }
  #imgZoom{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  #imgZoom.open{ display:flex; }
  #imgZoom img{ max-width:100%; max-height:100%; border-radius:8px; }
</style>
<style>
/* 모바일 최적화: 작은 아이콘 버튼의 터치 영역 확대 (보이는 크기는 그대로) */
button[aria-label]:has(> svg:only-child){ padding:11px; margin:-11px; }
/* 모바일 최적화: 입력칸 글자 16px — 아이폰에서 입력할 때 화면이 확대되는 현상 방지 */
@media (max-width:899px){
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]), textarea, select{ font-size:16px !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="back">
    <button onclick="location.href='tutors.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button id="langToggle" aria-label="언어 전환">
      <span class="cur" id="langCur">한국어</span> / <span id="langOther">EN</span>
    </button>
  </div>

  <div id="profileBody">
    <p class="loading">불러오는 중...</p>
  </div>
</div>

<div id="imgZoom" onclick="this.classList.remove('open')"><img alt=""></div>
<div class="booking-bar">
  <span class="price"><span id="tutorPrice">-</span><span class="unit" data-i18n="unit.perLesson">/회</span></span>
  <button id="bookBtn" data-i18n="profile.book">수업 예약하기</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// 필리핀 통신망·카카오톡 등 인앱브라우저에서 Firestore 연결 실패 방지 (롱폴링 강제)
try{ db.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, merge: true }); }catch(e){ console.warn('firestore settings', e); }

// 즉시상담 요청 시 PJ님께 바로 이메일 알림을 보내는 Apps Script 웹앱 주소
// script.google.com에서 instant-alert.gs 배포 후 나온 웹앱 URL로 교체하세요
const INSTANT_ALERT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz-3-NSaduh4Zn9DVXu-htxCAWFGU_nkn1bHLd66gSGuz60E9HVv0QyBbETsDnvn9ox/exec';

const urlParams = new URLSearchParams(window.location.search);
const currentTutorId = urlParams.get('id') || urlParams.get('tutor');
const wantsInstant = urlParams.get('instant') === '1';

let currentLang = localStorage.getItem('malmun_lang') || 'ko';
let tutorData = null;

const TRANSLATIONS = {
  ko: {
    "unit.perLesson": "/회", "profile.book": "수업 예약하기", "profile.notFound": "튜터 정보를 찾을 수 없어요",
    "instant.desc": "지금 바로 이야기하고 싶으신가요? 말문에 바로 알림이 가고, 연결되면 화상방에서 만나요.",
    "instant.btn": "지금 바로 상담 요청", "instant.sending": "요청 중...",
    "instant.sent": "요청을 보냈어요! 화상방에서 잠시 기다려 주세요.", "instant.err": "요청 중 문제가 생겼어요: ",
    "sec.story": "나의 이야기", "sec.gallery": "일상 구경하기", "sec.links": "온라인에서 더 보기", "more": "이야기 더 읽기 ▾", "less": "접기 ▴",
    "freetalk.desc": "지금이 아니어도 괜찮아요. 편한 요일·시간을 골라 무료 대화를 요청하면, 튜터가 확인하고 수락해요.",
    "freetalk.btn": "💬 무료 대화 요청하기"
  },
  en: {
    "unit.perLesson": "/lesson", "profile.book": "Book a lesson", "profile.notFound": "Could not find this tutor",
    "instant.desc": "Want to talk right now? Malmun gets notified immediately and you'll meet in a video room.",
    "instant.btn": "Request instant chat", "instant.sending": "Requesting...",
    "instant.sent": "Request sent! Please wait a moment in the video room.", "instant.err": "Something went wrong: ",
    "sec.story": "My story", "sec.gallery": "A peek at my everyday", "sec.links": "More of me online", "more": "Read more ▾", "less": "Show less ▴",
    "freetalk.desc": "Not right now? Pick a day and time and request a free chat — the tutor will review and accept.",
    "freetalk.btn": "💬 Request a free chat"
  },
  ja: {
    "unit.perLesson": "/回", "profile.book": "レッスンを予約する", "profile.notFound": "講師の情報が見つかりません",
    "instant.desc": "今すぐ話したいですか？マルムンにすぐ通知が届き、つながったらビデオルームでお会いします。",
    "instant.btn": "今すぐ相談をリクエスト", "instant.sending": "リクエスト中...",
    "instant.sent": "リクエストを送りました！ビデオルームで少しお待ちください。", "instant.err": "問題が発生しました：",
    "freetalk.desc": "今じゃなくても大丈夫。都合のいい曜日・時間を選んで無料トークをリクエストすると、講師が確認して承認します。",
    "freetalk.btn": "💬 無料トークをリクエスト",
    "sec.story": "わたしのこと", "sec.gallery": "わたしの日常", "sec.links": "オンラインでもっと見る", "more": "続きを読む ▾", "less": "閉じる ▴"
  }
};

function fmtKRW(n){ return '₩' + Number(n || 0).toLocaleString('en-US'); }

function renderProfile(){
  const bodyEl = document.getElementById('profileBody');
  if(!tutorData){
    bodyEl.innerHTML = `<p class="loading">${(TRANSLATIONS[currentLang] || TRANSLATIONS.ko)['profile.notFound']}</p>`;
    document.getElementById('bookBtn').style.display = 'none';
    return;
  }
  const ko = tutorData.ko || {};
  const loc = (currentLang !== 'ko' && tutorData[currentLang]) ? tutorData[currentLang] : {};
  const en = loc;   // (예전 코드 호환용 이름)
  const pick = k => (loc[k] && (typeof loc[k] !== 'string' || loc[k].trim())) ? loc[k] : ko[k];
  const d = {
    name: pick('name'),
    role: pick('role'),
    intro: pick('intro'),
    tags: (loc.tags && loc.tags.filter(Boolean).length) ? loc.tags : ko.tags,
    headline: pick('headline'),
    story: pick('story'),
    rating: ko.rating,
    reviewCount: ko.reviewCount,
    lessonCount: ko.lessonCount,
    reviewAuthor: ko.reviewAuthor,
    reviewBody: pick('reviewBody')
  };
  const TT = TRANSLATIONS[currentLang] || TRANSLATIONS.ko;
  const E = v => { const x = document.createElement('div'); x.textContent = v == null ? '' : String(v); return x.innerHTML; };
  const capOf = c => (c && typeof c === 'object') ? (c[currentLang] || c.ko || '') : (c || '');
  const storyParas = String(d.story || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const gallery = (tutorData.gallery || []).filter(g => g && g.img);
  const links = (tutorData.links || []).filter(l => l && /^https:\/\//.test(l.url || ''));
  const extraHtml = `
    ${storyParas.length ? `<p class="sec-title">${TT['sec.story']}</p>
      <div class="story${storyParas.length > 4 ? ' collapsed' : ''}" id="storyBox">${storyParas.map(p => `<p>${E(p).replace(/\n/g, '<br>')}</p>`).join('')}</div>
      ${storyParas.length > 4 ? `<button class="more-btn" id="storyMore">${TT['more']}</button>` : ''}` : ''}
    ${gallery.length ? `<p class="sec-title">${TT['sec.gallery']}</p>
      <div class="gallery">${gallery.map(g => { const c = capOf(g.caption); const t = capOf(g.title);
        return `<figure><img src="${E(g.img)}" alt="${E(t || c)}" loading="lazy" onclick="zoomImg(this.src)"><figcaption>${t ? `<b>${E(t)}</b>` : ''}${E(c)}</figcaption></figure>`; }).join('')}</div>` : ''}
    ${links.length ? `<p class="sec-title">${TT['sec.links']}</p>
      <div class="links">${links.map(l => `<a href="${E(l.url)}" target="_blank" rel="noopener">${E(capOf(l.label))}${capOf(l.sub) ? `<small>${E(capOf(l.sub))}</small>` : ''}</a>`).join('')}</div>` : ''}`;
  document.title = `${d.name} 튜터 | 말문`;

  const tags = (d.tags || []).filter(Boolean);
  bodyEl.innerHTML = `
    <div class="profile-head">
      <div class="avatar-lg" style="${tutorData.avatarImage ? `background:url('${tutorData.avatarImage}') center/cover;` : `background:${tutorData.avatarColor || '#3b5f8f'};`}"></div>
      <p class="name">${d.name}</p>
      <p class="role">${d.role || ''}</p>
      <div class="meta">${(Number(d.reviewCount) > 0 && d.rating) ? `<span class="star">★</span> ${d.rating} <span class="dim">· ${currentLang === 'ko' ? `후기 ${d.reviewCount}개` : `${d.reviewCount} reviews`}${Number(d.lessonCount) > 0 ? (currentLang === 'ko' ? ` · 수업 ${d.lessonCount}회` : ` · ${d.lessonCount} lessons`) : ''}</span>` : `<span class="dim">${currentLang === 'ko' ? '첫 수업 무료 오리엔테이션' : 'Free first orientation'}</span>`}</div>
    </div>
    ${d.headline ? `<p class="headline">${E(d.headline)}</p>` : ''}
    ${d.intro && !storyParas.length ? `<div class="section"><p class="intro">${d.intro}</p></div>` : ''}
    ${tags.length ? `<div class="tags">${tags.map((tag, i) => `<span class="tag${i === 0 ? ' highlight' : ''}">${tag}</span>`).join('')}</div>` : ''}
    ${extraHtml}
    ${d.reviewBody ? `
      <div class="review-card">
        <p class="author">${d.reviewAuthor || ''}</p>
        <p class="body">${d.reviewBody}</p>
      </div>
    ` : ''}
    <div class="instant-box">
      <p>${(TRANSLATIONS[currentLang] || TRANSLATIONS.ko)['instant.desc']}</p>
      <button id="instantBtn">${(TRANSLATIONS[currentLang] || TRANSLATIONS.ko)['instant.btn']}</button>
      <p style="margin:14px 0 8px;">${(TRANSLATIONS[currentLang] || TRANSLATIONS.ko)['freetalk.desc']}</p>
      <button onclick="location.href='free-talk.html?tutor=${encodeURIComponent(currentTutorId || '')}'">${(TRANSLATIONS[currentLang] || TRANSLATIONS.ko)['freetalk.btn']}</button>
    </div>
  `;
  document.getElementById('tutorPrice').textContent = fmtKRW(tutorData.price);
  document.getElementById('bookBtn').style.display = 'block';
  const instantBtn = document.getElementById('instantBtn');
  if(instantBtn){ instantBtn.addEventListener('click', requestInstant); }
  const moreBtn = document.getElementById('storyMore');
  if(moreBtn){ moreBtn.addEventListener('click', () => {
    const box = document.getElementById('storyBox');
    const open = box.classList.toggle('collapsed');
    moreBtn.textContent = open ? TT['more'] : TT['less'];
  }); }
}
function zoomImg(src){ const z = document.getElementById('imgZoom'); z.querySelector('img').src = src; z.classList.add('open'); }

async function requestInstant(){
  const T = TRANSLATIONS[currentLang] || TRANSLATIONS.ko;
  const user = auth.currentUser;
  if(!user){
    location.href = 'login.html?next=instant&tutor=' + currentTutorId;
    return;
  }
  const btn = document.getElementById('instantBtn');
  if(btn){ btn.disabled = true; btn.textContent = T['instant.sending']; }
  try{
    const roomId = `instant-${currentTutorId}-${Date.now().toString(36)}`;
    const studentName = user.displayName || (user.email ? user.email.split('@')[0] : '학생');
    await db.collection('instantRequests').add({
      tutorId: currentTutorId,
      tutorName: (tutorData && tutorData.ko && tutorData.ko.name) || currentTutorId,
      studentUid: user.uid,
      studentName: studentName,
      studentEmail: user.email || '',
      roomId: roomId,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // PJ님께 즉시 이메일 알림 (실패해도 학생은 화상방으로 이동하도록 별도 try/catch)
    try{
      fetch(INSTANT_ALERT_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          studentName: studentName,
          studentEmail: user.email || '',
          tutorName: (tutorData && tutorData.ko && tutorData.ko.name) || currentTutorId,
          roomId: roomId,
          joinUrl: `https://malmunkorean.com/classroom.html?room=${roomId}&tutor=${encodeURIComponent((tutorData && tutorData.ko && tutorData.ko.name) || currentTutorId)}&time=${encodeURIComponent(currentLang === 'ko' ? '지금 바로' : 'Right now')}`
        })
      });
    }catch(alertErr){
      console.error('즉시상담 알림 발송 실패(요청 자체는 정상 완료됨):', alertErr);
    }

    if(window.gtag){ gtag('event', 'instant_request_sent'); }
    location.href = `classroom.html?room=${roomId}&tutor=${encodeURIComponent((tutorData && tutorData.ko && tutorData.ko.name) || currentTutorId)}&time=${encodeURIComponent(currentLang === 'ko' ? '지금 바로' : 'Right now')}`;
  }catch(err){
    console.error('즉시상담 요청 실패:', err);
    alert(T['instant.err'] + err.message);
    if(btn){ btn.disabled = false; btn.textContent = T['instant.btn']; }
  }
}

async function loadTutor(){
  if(!currentTutorId){
    renderProfile();
    return;
  }
  try{
    const doc = await db.collection('tutors').doc(currentTutorId).get();
    tutorData = doc.exists ? doc.data() : null;
  }catch(err){
    console.error('튜터 정보 로드 실패:', err);
    tutorData = null;
  }
  renderProfile();
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  const NEXT = { ko:'en', en:'ja', ja:'ko' };
  const LBL = { ko:'한국어', en:'English', ja:'日本語' }, SHORT = { ko:'한글', en:'EN', ja:'日本語' };
  document.getElementById('langCur').textContent = LBL[lang] || '한국어';
  document.getElementById('langOther').textContent = SHORT[NEXT[lang] || 'en'];
  localStorage.setItem('malmun_lang', lang);
  renderProfile();
}

(function initLang(){
  const saved = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(saved);
})();

document.getElementById('langToggle').addEventListener('click', () => {
  const current = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(({ ko:'en', en:'ja', ja:'ko' })[current] || 'ko');
});

document.getElementById('bookBtn').addEventListener('click', () => {
  location.href = 'booking.html?tutor=' + currentTutorId;
});

let instantAutoFired = false;
loadTutor().then(() => {
  // 로그인 화면에서 "지금 바로 상담 요청"을 눌러 login.html?next=instant로 갔다가
  // 돌아온 경우, 로그인이 확인되는 즉시 자동으로 요청을 이어서 보냄
  if(wantsInstant){
    auth.onAuthStateChanged(user => {
      if(user && !instantAutoFired){
        instantAutoFired = true;
        requestInstant();
      }
    });
  }
});
</script>

</body>
</html>
