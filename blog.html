<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 | 말문 Malmun</title>
<meta name="description" content="한국어 학습, 한국 생활, 한국에서 일하기에 관한 이야기를 말문 커뮤니티에서 만나보세요.">
<link rel="canonical" href="https://malmunkorean.com/blog.html">
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
    --coral: #D85A30;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:76px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:600px; margin:0 auto; padding:0 20px 32px; }

  .header{ display:flex; justify-content:space-between; align-items:center; padding:24px 0 16px; }
  .header .title{ font-size:19px; font-weight:700; margin:0; }
  .lang-dropdown{ position:relative; }
  #langToggle{
    background:none; border:1px solid var(--card-border); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }
  #langToggle .caret{ font-size:10px; color:var(--text-muted); }
  .lang-menu{
    position:absolute; top:38px; right:0; z-index:30;
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    box-shadow:0 8px 24px rgba(44,44,42,0.12); min-width:120px; padding:6px;
    display:none;
  }
  .lang-menu.open{ display:block; }
  .lang-menu .lang-option{
    display:block; padding:8px 10px; border-radius:8px;
    font-size:13px; color:var(--text); font-weight:500; cursor:pointer;
  }
  .lang-menu .lang-option:hover{ background:var(--accent-soft); }
  .lang-menu .lang-option.active{ color:var(--accent-text); background:var(--accent-soft); }

  .search-bar{ display:flex; border:1px solid var(--card-border); border-radius:14px; overflow:hidden; background:var(--card); margin-bottom:12px; }
  .search-bar input{ flex:1; padding:12px 14px; border:none; outline:none; font-size:14px; font-family:inherit; background:none; color:var(--text); }
  .search-bar button{ background:none; border:none; padding:0 16px; cursor:pointer; font-size:15px; }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:16px; margin:0 -20px 4px; padding-left:20px; padding-right:20px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius:14px; border:1px solid var(--card-border);
    background:var(--card); font-size:12px; font-weight:600; color:var(--text-secondary); cursor:pointer;
  }
  .chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--coral); }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(min-width:600px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  .card{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; overflow:hidden; display:block; }
  .card-thumb{ height:110px; background:var(--accent-soft); position:relative; overflow:hidden; }
  .card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-cat{ position:absolute; top:8px; left:8px; background:var(--coral); color:#FFF9F0; font-size:10px; font-weight:700; padding:3px 9px; border-radius:10px; }
  .card-body{ padding:10px 12px 12px; }
  .card-title{ font-size:13px; font-weight:700; line-height:1.4; margin:0 0 6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-meta{ font-size:11px; color:var(--text-muted); }

  .empty{ text-align:center; padding:60px 20px; color:var(--text-muted); font-size:14px; grid-column:1/-1; }

  .pg{ display:flex; justify-content:center; gap:8px; padding:24px 0 8px; }
  .pg-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--card-border);
    background:var(--card); cursor:pointer; font-size:13px; font-weight:600; color:var(--text);
  }
  .pg-btn.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  body{ padding-bottom:76px; }
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--card-border);
    display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    max-width:600px; margin:0 auto;
  }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; color:var(--text-muted); background:none; border:none; cursor:pointer; }
  .nav-item.active{ color:var(--accent); }
  .nav-item span{ font-size:11px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <p class="title" data-i18n="blog.title">💬 말문 커뮤니티</p>
    <div style="display:flex; align-items:center; gap:8px;">
      <a href="blog-admin.html" style="width:32px; height:32px; border-radius:50%; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:14px;" aria-label="블로그 관리">✍️</a>
      <div class="lang-dropdown" id="langDropdown">
        <button id="langToggle" aria-label="언어 전환" onclick="toggleLangMenu(event)">
          <span class="cur" id="langCur">한국어</span> <span class="caret">▾</span>
        </button>
        <div class="lang-menu" id="langMenu">
          <div class="lang-option" data-lang="ko" onclick="setLang(event,'ko')">한국어</div>
          <div class="lang-option" data-lang="en" onclick="setLang(event,'en')">English</div>
          <div class="lang-option" data-lang="ja" onclick="setLang(event,'ja')">日本語</div>
        </div>
      </div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="궁금한 주제를 검색해보세요" oninput="filterPosts()">
    <button onclick="filterPosts()">🔍</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="grid" id="grid"></div>

  <div class="pg" id="pg"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='index.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span data-i18n="nav.home">홈</span>
  </button>
  <button class="nav-item" onclick="location.href='tutors.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span data-i18n="nav.tutors">튜터</span>
  </button>
  <button class="nav-item" onclick="location.href='curriculum.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    <span data-i18n="nav.curriculum">커리큘럼</span>
  </button>
  <button class="nav-item active" onclick="location.href='blog.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span data-i18n="nav.community">커뮤니티</span>
  </button>
  <button class="nav-item" onclick="location.href='mypage.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span data-i18n="nav.mypage">마이페이지</span>
  </button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PER_PAGE = 12;
let POSTS = [];
let filtered = [];
let currentPage = 1;
let currentCat = '전체';

const BLOG_UI = {
  ko: { all: '전체', searchPlaceholder: '궁금한 주제를 검색해보세요', loading: '글을 불러오는 중...', loadFail: '글을 불러오지 못했습니다', noResult: '검색 결과가 없습니다' },
  en: { all: 'All', searchPlaceholder: 'Search for a topic', loading: 'Loading posts...', loadFail: 'Could not load posts', noResult: 'No results found' },
  ja: { all: 'すべて', searchPlaceholder: '気になるトピックを検索', loading: '記事を読み込み中...', loadFail: '記事を読み込めませんでした', noResult: '検索結果がありません' }
};
function blogLang(){ return localStorage.getItem('malmun_lang') || 'ko'; }

async function loadPosts(){
  const grid = document.getElementById('grid');
  const lang = blogLang();
  grid.innerHTML = `<div class="empty">${BLOG_UI[lang].loading}</div>`;
  try{
    const snap = await db.collection('blogPosts').where('published','==',true).orderBy('createdAt','desc').get();
    const dateLocale = { ko: 'ko-KR', en: 'en-US', ja: 'ja-JP' }[lang] || 'ko-KR';
    POSTS = snap.docs.map(d => {
      const p = d.data();
      const dt = p.createdAt ? new Date(p.createdAt.seconds*1000) : new Date();
      return {
        id:d.id, title:p.title, cat:p.cat||'', excerpt:p.excerpt||'', thumb:p.thumb||'',
        date: dt.toLocaleDateString(dateLocale,{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,'')
      };
    });
    filtered = [...POSTS];
    buildChips();
    render();
  }catch(e){
    console.error(e);
    grid.innerHTML = `<div class="empty">${BLOG_UI[lang].loadFail}</div>`;
  }
}

function buildChips(){
  const lang = blogLang();
  const cats = ['전체', ...new Set(POSTS.map(p => p.cat).filter(Boolean))];
  const chipsWrap = document.getElementById('chips');
  chipsWrap.innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c === '전체' ? ' active' : '');
    b.textContent = (c === '전체') ? BLOG_UI[lang].all : c;
    b.onclick = () => {
      currentCat = c;
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      filterPosts();
    };
    chipsWrap.appendChild(b);
  });
}

function filterPosts(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  filtered = POSTS.filter(p => {
    const matchCat = currentCat === '전체' || p.cat === currentCat;
    const matchQ = !q || p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  currentPage = 1;
  render();
}

function render(){
  const grid = document.getElementById('grid');
  const start = (currentPage - 1) * PER_PAGE;
  const items = filtered.slice(start, start + PER_PAGE);

  if(!items.length){
    grid.innerHTML = `<div class="empty">${BLOG_UI[blogLang()].noResult}</div>`;
    document.getElementById('pg').innerHTML = '';
    return;
  }

  grid.innerHTML = items.map(p => `
    <a href="article.html?id=${p.id}" class="card">
      <div class="card-thumb">
        <img src="${p.thumb}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'">
        <span class="card-cat">${p.cat}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-meta">${p.date}</div>
      </div>
    </a>
  `).join('');

  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const pg = document.getElementById('pg');
  if(totalPages <= 1){ pg.innerHTML = ''; return; }
  pg.innerHTML = Array.from({length:totalPages}, (_,i) =>
    `<button class="pg-btn${i+1===currentPage?' active':''}" onclick="goPage(${i+1})">${i+1}</button>`
  ).join('');
}

function goPage(n){ currentPage = n; render(); window.scrollTo({top:0,behavior:'smooth'}); }

loadPosts();

const TRANSLATIONS = {
  ko: { "blog.title":"💬 말문 커뮤니티", "nav.home":"홈","nav.tutors":"튜터","nav.curriculum":"커리큘럼","nav.community":"커뮤니티","nav.mypage":"마이페이지" },
  en: { "blog.title":"💬 Malmun Community", "nav.home":"Home","nav.tutors":"Tutors","nav.curriculum":"Curriculum","nav.community":"Community","nav.mypage":"My page" },
  ja: { "blog.title":"💬 マルムンコミュニティ", "nav.home":"ホーム","nav.tutors":"講師","nav.curriculum":"カリキュラム","nav.community":"コミュニティ","nav.mypage":"マイページ" }
};
function applyLang(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined) el.innerHTML = dict[key];
  });
  const LANG_LABELS = { ko: '한국어', en: 'English', ja: '日本語' };
  document.getElementById('langCur').textContent = LANG_LABELS[lang] || LANG_LABELS.ko;
  document.querySelectorAll('.lang-menu .lang-option').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-lang') === lang);
  });
  const searchInput = document.getElementById('search-input');
  if(searchInput) searchInput.placeholder = BLOG_UI[lang].searchPlaceholder;
  localStorage.setItem('malmun_lang', lang);
}
function toggleLangMenu(e){
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
}
function setLang(e, lang){
  e.stopPropagation();
  applyLang(lang);
  document.getElementById('langMenu').classList.remove('open');
  loadPosts();
}
document.addEventListener('click', () => {
  const menu = document.getElementById('langMenu');
  if(menu) menu.classList.remove('open');
});
(function(){ applyLang(localStorage.getItem('malmun_lang') || 'ko'); })();
</script>

</body>
</html>
