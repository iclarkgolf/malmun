    write:'+ ソウル情報をシェア', wTitle:'ソウル情報をシェア', lCat:'カテゴリー', lTitle:'タイトル', lPlace:'場所 (任意)', lBody:'内容', hBody:'韓国語・英語・日本語どれでもOK。管理者の確認後に公開されます。', lName:'表示する名前', cancel:'キャンセル', save:'送信',
    phTitle:'例: 広蔵市場のビンデトック', phPlace:'例: 鍾路区 広蔵市場', phBody:'場所、おすすめポイント、行き方、値段など自由に書いてください。',
    empty:'まだ投稿がありません。最初の情報をシェアしてください!', loading:'読み込み中...', more:'もっと見る', less:'閉じる', wait:'確認待ち', mine:'あなたの投稿 (承認まで本人のみ表示)',
    needLogin:'投稿にはログインが必要です。Googleでログインします。', sent:'送信しました!確認後に公開されます。', fill:'タイトルと内容を書いてください。', fail:'送信できませんでした。もう一度お試しください。',
    lPhotos:'写真 (任意・3枚まで)', addPhoto:'写真を追加', hPlace:'場所を書くとGoogleマップが自動で付きます。', map:'地図を見る', mapHide:'地図を閉じる', openMap:'Googleマップで開く', upWait:'写真をアップロード中です。少々お待ちください...', upFail:'写真が1枚アップロードできませんでした。削除してもう一度追加してください。', badImg:'この写真は読み込めません。別の写真を選んでください。', tr:'翻訳を見る', approve:'承認', del:'削除', delAsk:'この投稿を削除しますか?', adminBar:'管理者モード · 確認待ち ', home:'ホーム', tutors:'チューター', cur:'カリキュラム', com:'コミュニティ', my:'マイページ' }
};
function L(){ try{ const l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('malmun_lang') || 'ko'; return T[l] ? l : 'ko'; }catch(e){ return 'ko'; } }
function t(k){ return T[L()][k] || T.ko[k] || k; }
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function toast(m){ const el = document.getElementById('toast'); el.textContent = m; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 3200); }

let cat = 'all', posts = [], mine = [], pendingAll = [], isAdmin = false, user = null;

function applyLang(){
  const map = { tBack:'back', tTitle:'title', tSub:'sub', tTag:'tag', writeBtn:'write', wTitle:'wTitle', lCat:'lCat', lTitle:'lTitle', lPlace:'lPlace', lBody:'lBody', hBody:'hBody', lName:'lName', bCancel:'cancel', bSave:'save', lPhotos:'lPhotos', hPlace:'hPlace' };
  Object.keys(map).forEach(id => { const el = document.getElementById(id); if(el) el.textContent = t(map[id]); });
  document.getElementById('fTitle').placeholder = t('phTitle');
  document.getElementById('fPlace').placeholder = t('phPlace');
  document.getElementById('fBody').placeholder = t('phBody');
  document.querySelectorAll('[data-n]').forEach(el => el.textContent = t(el.getAttribute('data-n')));
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === L()));
  document.documentElement.lang = L();
  document.getElementById('fCat').innerHTML = CATS.map(c => `<option value="${c}">${esc(t(c))}</option>`).join('');
  renderCats(); render(); renderUploads();
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => {
  try{ localStorage.setItem('malmun_lang', b.dataset.l); }catch(e){}
  const u = new URL(location.href); u.searchParams.delete('lang'); history.replaceState(null, '', u);
  applyLang();
});

function renderCats(){
  document.getElementById('cats').innerHTML = ['all'].concat(CATS).map(c => `<button class="${c === cat ? 'on' : ''}" onclick="setCat('${c}')">${esc(t(c))}</button>`).join('');
}
function setCat(c){ cat = c; renderCats(); render(); }

function dateText(p){ const s = p.createdAt && p.createdAt.seconds; if(!s) return ''; return new Date(s * 1000).toLocaleDateString(L() === 'en' ? 'en-US' : (L() === 'ja' ? 'ja-JP' : 'ko-KR')); }
function card(p, kind){
  const long = (p.body || '').length > 260;
  return `<div class="card ${kind !== 'pub' ? 'pending' : ''}" id="c_${p.id}">
    <div class="meta"><span class="cat">${esc(t(p.category) || p.category)}</span><span>${esc(p.name || 'Guest')}</span><span>${dateText(p)}</span>${kind !== 'pub' ? `<span class="badge-wait">${esc(t('wait'))}</span>` : ''}</div>
    <h3>${esc(p.title)}</h3>
    ${p.place ? `<p class="place">${esc(p.place)}</p>` : ''}
    <p class="body ${long ? 'short' : ''}">${esc(p.body)}</p>
    ${picsHtml(p)}
    ${long ? `<button class="more" onclick="toggleMore(this)">${esc(t('more'))}</button>` : ''}<a class="tr" href="${esc(trUrl(p))}" target="_blank" rel="noopener" style="${long ? '' : 'margin-left:0;'}">${esc(t('tr'))}</a>${p.place ? `<button class="mapbtn" onclick="toggleMap(this, '${p.id}')">${esc(t('map'))}</button><div class="mapbox" id="m_${p.id}" hidden></div>` : ''}
    ${isAdmin ? `<div class="admin-row">${kind !== 'pub' ? `<button class="ok-btn" onclick="approve('${p.id}')">${esc(t('approve'))}</button>` : ''}<button class="del-btn" onclick="delPost('${p.id}')">${esc(t('del'))}</button></div>` : ''}
  </div>`;
}
// 번역 보기: 구글 번역을 새 창으로 열어, 지금 고른 언어로 글을 번역해 보여 줌
function trUrl(p){
  const txt = [p.title, p.place, p.body].filter(Boolean).join('\n\n').slice(0, 1800);
  return 'https://translate.google.com/?sl=auto&tl=' + L() + '&op=translate&text=' + encodeURIComponent(txt);
}
function toggleMore(btn){ const b = btn.previousElementSibling; const short = b.classList.toggle('short'); btn.textContent = short ? t('more') : t('less'); }

function render(){
  const box = document.getElementById('list');
  const f = p => cat === 'all' || p.category === cat;
  let html = '';
  if(isAdmin){
    document.getElementById('adminBar').innerHTML = `<div class="admin-bar">${esc(t('adminBar'))}${pendingAll.length}</div>`;
    html += pendingAll.filter(f).map(p => card(p, 'wait')).join('');
  }else if(mine.length){
    html += mine.filter(f).map(p => card(p, 'mine')).join('');
  }
  const pub = posts.filter(f);
  html += pub.map(p => card(p, 'pub')).join('');
  box.innerHTML = html || `<div class="empty">${esc(t('empty'))}</div>`;
}

function sortNew(a, b){ return ((b.createdAt && b.createdAt.seconds) || 9e12) - ((a.createdAt && a.createdAt.seconds) || 9e12); }
async function loadPublic(){
  try{
    const snap = await db.collection('boardPosts').where('approved', '==', true).get();
    posts = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort(sortNew);
  }catch(e){ console.error(e); posts = []; }
  render();
}
async function loadMine(){
  mine = []; pendingAll = [];
  if(!user) return render();
  try{
    if(isAdmin){
      const s = await db.collection('boardPosts').where('approved', '==', false).get();
      pendingAll = s.docs.map(d => Object.assign({ id: d.id }, d.data())).sort(sortNew);
    }else{
      const s = await db.collection('boardPosts').where('uid', '==', user.uid).get();
      mine = s.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(p => !p.approved).sort(sortNew);
    }
  }catch(e){ console.error(e); }
  render();
}

auth.onAuthStateChanged(u => {
  user = u;
  isAdmin = !!u && u.emailVerified && (u.email || '').toLowerCase() === ADMIN;
  if(u && !document.getElementById('fName').value) document.getElementById('fName').value = u.displayName || '';
  loadMine();
});

async function openWrite(){
  if(!auth.currentUser){
    toast(t('needLogin'));
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    try{ await auth.signInWithPopup(p); }catch(e){ try{ await auth.signInWithRedirect(p); }catch(_){ } return; }
  }
  document.getElementById('overlay').classList.add('on');
}
function closeWrite(){ document.getElementById('overlay').classList.remove('on'); }

async function savePost(){
  const u = auth.currentUser; if(!u) return openWrite();
  const title = document.getElementById('fTitle').value.trim();
  const body = document.getElementById('fBody').value.trim();
  if(!title || !body){ toast(t('fill')); return; }
  const data = {
    uid: u.uid,
    name: (document.getElementById('fName').value.trim() || u.displayName || 'Guest').slice(0, 30),
    category: document.getElementById('fCat').value,
    title: title.slice(0, 100),
    place: document.getElementById('fPlace').value.trim().slice(0, 100),
    body: body.slice(0, 3000),
    lang: L(),
    approved: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const btn = document.getElementById('bSave'); btn.disabled = true;
  if(ups.some(u => !u.url && !u.err)){ toast(t('upWait')); await Promise.all(ups.map(u => u.done)); }
  if(ups.some(u => u.err)){ toast(t('upFail')); btn.disabled = false; return; }
  const photos = ups.map(u => u.url).filter(u => PHOTO_OK.test(u)).slice(0, 3);
  if(photos.length) data.photos = photos;
  try{
    await db.collection('boardPosts').add(data);
    ['fTitle','fPlace','fBody'].forEach(id => document.getElementById(id).value = '');
    ups = []; renderUploads(); placePreview();
    closeWrite(); toast(t('sent')); loadMine();
  }catch(e){ console.error(e); toast(t('fail')); }
  btn.disabled = false;
}


// ───── 사진 · 지도 (2026-11-09) ─────
// 사진: 고르는 즉시 휴대폰 안에서 작게 줄이고(긴 쪽 1280px) 바로 올리기 시작 → 글을 쓰는 동안 뒤에서 올라감
// 지도: 구글 지도 퍼가기 (키 필요 없음). 목록에서는 [지도 보기]를 누를 때만 불러와서 화면이 무겁지 않게
const PHOTO_OK = /^https:\/\/firebasestorage\.googleapis\.com\/v0\/b\/malmun-bca03\.firebasestorage\.app\/o\/board%2F[^"'<>\s]+$/;
function picsHtml(p){
  const ph = (Array.isArray(p.photos) ? p.photos : []).filter(u => PHOTO_OK.test(u)).slice(0, 3);
  if(!ph.length) return '';
  return `<div class="pics n${ph.length}">${ph.map(u => `<img src="${u}" loading="lazy" alt="" onclick="showPic(this)">`).join('')}</div>`;
}
// 사진 크게 보기: 같은 글의 사진을 옆으로 밀어서(또는 화살표로) 넘김
let lbList = [], lbI = 0;
function showPic(img){
  lbList = [...img.parentNode.querySelectorAll('img')].map(x => x.src); lbI = Math.max(0, lbList.indexOf(img.src));
  drawPic(); document.getElementById('lightbox').classList.add('on'); document.body.style.overflow = 'hidden';
}
function drawPic(){
  document.getElementById('lbImg').src = lbList[lbI];
  document.getElementById('lbN').textContent = lbList.length > 1 ? (lbI + 1) + ' / ' + lbList.length : '';
  document.querySelectorAll('.lb-a').forEach(b => b.style.visibility = lbList.length > 1 ? 'visible' : 'hidden');
}
function stepPic(d){ if(lbList.length < 2) return; lbI = (lbI + d + lbList.length) % lbList.length; drawPic(); }
function closePic(){ document.getElementById('lightbox').classList.remove('on'); document.body.style.overflow = ''; }
(function(){
  let x0 = null, y0 = 0; const lb = document.getElementById('lightbox');
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) stepPic(dx < 0 ? 1 : -1);
    else if(dy > 80) closePic();
  });
  document.addEventListener('keydown', e => { if(!lb.classList.contains('on')) return; if(e.key === 'Escape') closePic(); if(e.key === 'ArrowRight') stepPic(1); if(e.key === 'ArrowLeft') stepPic(-1); });
})();
function mapLang(){ return L() === 'ja' ? 'ja' : (L() === 'en' ? 'en' : 'ko'); }
function mapEmbed(q, h){ return `<iframe src="https://maps.google.com/maps?q=${encodeURIComponent(q)}&hl=${mapLang()}&z=15&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="height:${h}px" title="map"></iframe>`; }
function mapLink(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function toggleMap(btn, id){
  const box = document.getElementById('m_' + id); if(!box) return;
  const p = posts.concat(mine, pendingAll).find(x => x.id === id); if(!p || !p.place) return;
  if(box.hidden){
    if(!box.innerHTML) box.innerHTML = mapEmbed(p.place, 220) + `<a href="${mapLink(p.place)}" target="_blank" rel="noopener">${esc(t('openMap'))}</a>`;
    box.hidden = false; btn.textContent = t('mapHide');
  }else{ box.hidden = true; btn.textContent = t('map'); }
}
let placeTimer = null, placeShown = '';
function placePreview(){
  clearTimeout(placeTimer);
  placeTimer = setTimeout(() => {
    const q = document.getElementById('fPlace').value.trim(), box = document.getElementById('placeMap');
    if(q.length < 2){ box.style.display = 'none'; box.innerHTML = ''; placeShown = ''; return; }
    if(q === placeShown) return;
    placeShown = q; box.innerHTML = mapEmbed(q, 160); box.style.display = 'block';
  }, 900);
}

// 올릴 사진 목록: { key, thumb, url, pct, err, task }
let ups = [];
function renderUploads(){
  const g = document.getElementById('upGrid'); if(!g) return;
  g.innerHTML = ups.map(u => `<div class="up-item ${u.err ? 'err' : ''}"><img src="${u.thumb}" alt=""><div class="bar" style="width:${u.url ? 0 : u.pct}%"></div><button class="x" type="button" onclick="removeUp('${u.key}')">×</button></div>`).join('') +
    (ups.length < 3 ? `<button class="up-add" type="button" onclick="document.getElementById('fPhotos').click()"><b>+</b>${esc(t('addPhoto'))}</button>` : '');
}
function removeUp(key){
  const u = ups.find(x => x.key === key); if(!u) return;
  try{ u.task && !u.url && u.task.cancel(); }catch(e){}
  if(u.ref && u.url) u.ref.delete().catch(() => {});
  ups = ups.filter(x => x.key !== key); renderUploads();
}
function shrink(file){
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : bad(new Error('blob')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('decode')); };
    img.src = url;
  });
}
async function pickPhotos(input){
  const files = [...input.files].slice(0, 3 - ups.length); input.value = '';
  const u0 = auth.currentUser; if(!u0) return openWrite();
  for(const f of files){
    let blob;
    try{ blob = await shrink(f); }catch(e){ toast(t('badImg')); continue; }
    const key = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const it = { key, thumb: URL.createObjectURL(blob), url: '', pct: 3, err: false };
    ups.push(it); renderUploads();
    it.ref = storage.ref('board/' + u0.uid + '/' + key + '.jpg');
    it.task = it.ref.put(blob, { contentType: 'image/jpeg', cacheControl: 'public,max-age=31536000' });
    it.done = new Promise(res => {
      it.task.on('state_changed',
        s => { it.pct = Math.max(3, Math.round(s.bytesTransferred / s.totalBytes * 100)); const b = document.querySelector(`.up-item:nth-child(${ups.indexOf(it) + 1}) .bar`); if(b) b.style.width = it.pct + '%'; },
        e => { if(e && e.code === 'storage/canceled') return res(); console.error(e); it.err = true; renderUploads(); res(); },
        async () => { try{ it.url = await it.ref.getDownloadURL(); }catch(e){ it.err = true; } renderUploads(); res(); });
    });
  }
}

async function approve(id){
  try{ await db.collection('boardPosts').doc(id).update({ approved: true, approvedAt: firebase.firestore.FieldValue.serverTimestamp() }); await loadPublic(); await loadMine(); }
  catch(e){ console.error(e); toast(t('fail')); }
}
async function delPost(id){
  if(!confirm(t('delAsk'))) return;
  const p = posts.concat(mine, pendingAll).find(x => x.id === id);
  try{ await db.collection('boardPosts').doc(id).delete();
    (p && Array.isArray(p.photos) ? p.photos : []).filter(u => PHOTO_OK.test(u)).forEach(u => { try{ storage.refFromURL(u).delete().catch(() => {}); }catch(e){} });
    await loadPublic(); await loadMine(); }
  catch(e){ console.error(e); toast(t('fail')); }
}

applyLang();
loadPublic();
</script>
