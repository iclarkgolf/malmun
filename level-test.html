<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레벨테스트 | 말문</title>
<style>
  :root{
    --bg: #0f1115;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --text: #f5f4f0;
    --text-secondary: #c2c0b6;
    --text-muted: #7a7871;
    --accent: #e0993a;
    --accent-text: #1a1206;
    --accent-soft: rgba(224,153,58,0.10);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; width:100%; padding:0 20px; flex:1; display:flex; flex-direction:column; }

  .topbar{ display:flex; align-items:center; gap:12px; padding:24px 0 20px; }
  .back{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  .progress-track{ flex:1; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:2px; transition:width .3s ease; }
  .progress-label{ font-size:12px; color:var(--text-muted); white-space:nowrap; }

  .q-tag{ font-size:12px; font-weight:600; color:var(--accent); margin:0 0 10px; }
  .q-text{ font-size:17px; line-height:1.6; margin:0 0 24px; }

  .audio-row{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.05); border-radius:12px; padding:14px;
    margin-bottom:20px; cursor:pointer; border:none; width:100%; text-align:left;
  }
  .audio-icon{
    width:36px; height:36px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .audio-row span{ font-size:13px; color:var(--text-secondary); }

  .option{
    display:block; width:100%; text-align:left;
    border:0.5px solid rgba(255,255,255,0.15); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; font-size:14px; color:#e5e4dd;
    background:transparent; cursor:pointer; transition:all .15s ease;
  }
  .option:hover{ border-color:rgba(255,255,255,0.3); }
  .option.selected{ border-color:var(--accent); background:var(--accent-soft); color:#f0c98a; }

  .bottom{ padding:20px 0 32px; margin-top:auto; }
  .btn-primary{
    display:block; width:100%; text-align:center; padding:16px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button class="back" onclick="location.href='index.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:35%"></div></div>
    <span class="progress-label" id="progressLabel">7 / 20</span>
  </div>

  <div>
    <p class="q-tag">듣기 · 초급</p>
    <p class="q-text">다음 대화를 듣고, 여자가 무엇을 주문했는지 고르세요.</p>

    <button class="audio-row" id="playAudio">
      <div class="audio-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1a1206"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span>음성 재생 (0:14)</span>
    </button>

    <div id="options">
      <button class="option" data-value="americano">아메리카노</button>
      <button class="option" data-value="latte">카페라떼</button>
      <button class="option" data-value="greentea">녹차</button>
      <button class="option" data-value="blacktea">홍차</button>
    </div>
  </div>

  <div class="bottom">
    <button class="btn-primary" id="nextBtn">다음 문항</button>
  </div>
</div>

<script>
  const options = document.querySelectorAll('.option');
  let selected = null;
  options.forEach(opt => {
    opt.addEventListener('click', () => {
      options.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selected = opt.dataset.value;
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if(!selected){
      alert('보기를 선택해주세요.');
      return;
    }
    // 실제 서비스에서는 다음 문항 로드 또는 결과 페이지로 이동
    location.href = 'level-result.html';
  });

  document.getElementById('playAudio').addEventListener('click', () => {
    // 실제 서비스에서는 오디오 재생 로직 연결
    console.log('오디오 재생');
  });
</script>

</body>
</html>
