<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 관리 | 말문 Admin</title>
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
    --danger: #D85A30;
    --success: #3FA34D;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:640px; margin:0 auto; padding:24px 20px 60px; }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ font-size:13px; color:var(--text-muted); margin:0 0 24px; }

  #gate{ max-width:320px; margin:80px auto; text-align:center; }
  #gate input{
    width:100%; padding:12px; border:1px solid var(--card-border); border-radius:10px;
    font-size:14px; margin-bottom:10px; box-sizing:border-box;
  }
  #gate button{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent);
    color:var(--accent-text); font-weight:600; font-size:14px; cursor:pointer;
  }
  #gateError{ color:var(--danger); font-size:12px; margin-top:8px; display:none; }

  #app{ display:none; }

  .write-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:18px; margin-bottom:26px;
  }
  label{ display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px; }
  input[type=text], textarea{
    width:100%; padding:12px 14px; border:1px solid var(--card-border); border-radius:10px;
    font-size:14px; color:var(--text); font-family:inherit; background:#fff; box-sizing:border-box;
    margin-bottom:16px;
  }
  textarea{ resize:vertical; min-height:110px; line-height:1.6; }

  .important-row{
    display:flex; align-items:center; gap:10px; background:var(--accent-soft);
    border:1px solid #F0D9A8; border-radius:12px; padding:12px 14px; margin-bottom:16px;
  }
  .important-row input{ width:auto; margin:0; }
  .important-row .txt{ font-size:12px; color:var(--accent-text); line-height:1.6; }

  .submit-btn{
    display:block; width:100%; text-align:center; padding:13px; border-radius:12px;
    font-size:14px; font-weight:700; cursor:pointer; border:none;
    background:var(--accent); color:var(--accent-text);
  }
  .submit-btn:disabled{ background:#EAE6D8; color:var(--text-muted); cursor:default; }
  .status-msg{ font-size:12px; margin-top:10px; display:none; }
  .status-msg.ok{ color:var(--success); }
  .status-msg.err{ color:var(--danger); }

  .section-label{ font-size:12px; font-weight:600; color:var(--text-muted); margin:0 0 12px; }

  .notice-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding:16px 18px; margin-bottom:12px;
  }
  .n-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .n-title{ font-size:14px; font-weight:700; margin:0; }
  .n-badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:14px; background:var(--accent-soft); color:var(--accent-text); white-space:nowrap; }
  .n-body{ font-size:13px; color:var(--text-secondary); line-height:1.6; white-space:pre-wrap; margin:0 0 8px; }
  .n-meta{ font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center; }
  .del-btn{ background:none; border:none; color:var(--danger); font-size:11px; cursor:pointer; padding:0; }

  .empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:40px 0; }
  .loading{ text-align:center; color:var(--text-muted); font-size:13px; padding:40px 0; }
</style>
</head>
<body>

<div id="gate">
  <h1 style="text-align:center;">공지사항 admin</h1>
  <input type="password" id="pwInput" placeholder="비밀번호">
  <button id="pwBtn">입장</button>
  <p id="gateError">비밀번호가 틀렸습니다</p>
</div>

<div id="app">
  <div class="wrap">
    <p style="margin:0 0 10px;"><a href="admin.html" style="font-size:12px; color:var(--text-muted);">← 관리자 홈</a></p>
    <h1>공지사항 관리</h1>
    <p class="sub">여기서 작성하면 튜터들이 예약 관리 화면(tutor-bookings.html) 상단에서 바로 확인할 수 있어요. "중요" 체크하면 이메일도 같이 발송돼요.</p>

    <div class="write-card">
      <label>제목</label>
      <input type="text" id="fTitle" placeholder="예: 8월 셋째 주 수업시간 안내">
      <label>내용</label>
      <textarea id="fBody" placeholder="튜터들에게 전달할 내용을 적어주세요"></textarea>
      <div class="important-row">
        <input type="checkbox" id="fImportant">
        <label for="fImportant" class="txt" style="margin:0;">중요 공지 — 저장 시 승인된 튜터 전원에게 이메일도 자동 발송</label>
      </div>
      <button class="submit-btn" id="submitBtn">공지 등록하기</button>
      <p class="status-msg" id="statusMsg"></p>
    </div>

    <p class="section-label">등록된 공지 (최신순)</p>
    <div id="list"><p class="loading">불러오는 중...</p></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ADMIN_PW = "admin0115";

// 공지 이메일 발송용 Google Apps Script 웹앱 URL — 배포 후 여기에 붙여넣으세요.
// 비워두면 공지는 정상 저장되고, 이메일 발송만 건너뜁니다.
const EMAIL_WEBHOOK_URL = "";

document.getElementById('pwBtn').addEventListener('click', tryUnlock);
document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

function tryUnlock(){
  const val = document.getElementById('pwInput').value;
  if(val === ADMIN_PW){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('malmun_admin_ok', '1');
    loadNotices();
  }else{
    document.getElementById('gateError').style.display = 'block';
  }
}

if(sessionStorage.getItem('malmun_admin_ok') === '1'){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadNotices();
}

let allNotices = [];

async function loadNotices(){
  try{
    const snap = await db.collection('notices').orderBy('createdAt', 'desc').limit(50).get();
    allNotices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }catch(err){
    console.error('공지 목록 불러오기 실패:', err);
    document.getElementById('list').innerHTML = `<p class="empty">공지 목록을 불러오지 못했어요.<br>${err.message}</p>`;
  }
}

async function getApprovedTutorEmails(){
  const snap = await db.collection('tutorApplications').where('status', '==', 'approved').get();
  return snap.docs.map(d => d.data().email).filter(Boolean);
}

async function sendEmailNotice(title, body, emails){
  if(!EMAIL_WEBHOOK_URL){
    console.warn('EMAIL_WEBHOOK_URL이 설정되지 않아 이메일 발송을 건너뜁니다.');
    return { skipped: true };
  }
  if(emails.length === 0){
    return { skipped: true, reason: 'no-emails' };
  }
  const res = await fetch(EMAIL_WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Apps Script CORS 우회용
    body: JSON.stringify({ title, body, emails })
  });
  return res.json().catch(() => ({}));
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const title = document.getElementById('fTitle').value.trim();
  const body = document.getElementById('fBody').value.trim();
  const important = document.getElementById('fImportant').checked;
  const btn = document.getElementById('submitBtn');
  const msgEl = document.getElementById('statusMsg');
  msgEl.style.display = 'none';

  if(!title || !body){
    msgEl.textContent = '제목과 내용을 모두 입력해주세요.';
    msgEl.className = 'status-msg err';
    msgEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '등록 중...';

  try{
    await db.collection('notices').add({
      title, body, important,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    if(important){
      btn.textContent = '이메일 발송 중...';
      try{
        const emails = await getApprovedTutorEmails();
        await sendEmailNotice(title, body, emails);
      }catch(mailErr){
        console.error('이메일 발송 실패:', mailErr);
        msgEl.textContent = '공지는 저장됐지만 이메일 발송에는 실패했어요: ' + mailErr.message;
        msgEl.className = 'status-msg err';
        msgEl.style.display = 'block';
      }
    }

    if(msgEl.style.display !== 'block'){
      msgEl.textContent = '공지 등록 완료' + (important ? ' — 이메일도 발송했어요.' : '');
      msgEl.className = 'status-msg ok';
      msgEl.style.display = 'block';
    }

    document.getElementById('fTitle').value = '';
    document.getElementById('fBody').value = '';
    document.getElementById('fImportant').checked = false;
    loadNotices();
  }catch(err){
    console.error('공지 등록 실패:', err);
    msgEl.textContent = '등록 중 문제가 생겼어요: ' + err.message;
    msgEl.className = 'status-msg err';
    msgEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = '공지 등록하기';
  }
});

async function deleteNotice(id){
  if(!confirm('이 공지를 삭제할까요?')) return;
  try{
    await db.collection('notices').doc(id).delete();
    allNotices = allNotices.filter(n => n.id !== id);
    render();
  }catch(err){
    alert('삭제 실패: ' + err.message);
  }
}

function render(){
  const list = document.getElementById('list');
  if(allNotices.length === 0){
    list.innerHTML = `<p class="empty">아직 등록된 공지가 없어요.</p>`;
    return;
  }
  list.innerHTML = allNotices.map(n => {
    const date = n.createdAt && n.createdAt.toDate ? n.createdAt.toDate().toLocaleDateString('ko-KR') : '';
    return `
      <div class="notice-card">
        <div class="n-top">
          <p class="n-title">${escapeHtml(n.title || '')}</p>
          ${n.important ? '<span class="n-badge">중요·이메일발송</span>' : ''}
        </div>
        <p class="n-body">${escapeHtml(n.body || '')}</p>
        <div class="n-meta">
          <span>${date}</span>
          <button class="del-btn" onclick="deleteNotice('${n.id}')">삭제</button>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>

</body>
</html>
